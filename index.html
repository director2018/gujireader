/**
 * 把 manifest 里的 file 字段解析成真正可用的图片地址。
 *
 * 两种来源：
 *   - 磁盘数据（来自 data/manifest.json）：file 是 "pages/00000.png" 这类相对路径，
 *     需要补上 "data/" 前缀。
 *   - 本机导入（拖放 / 选择文件）：file 已经是 blob: 或 data: 地址，直接使用。
 *
 * 早期版本无条件拼接 "data/"，导致导入本机文件时地址变成 "data/blob:http://…"
 * 而图片无法显示，这里按协议前缀区分处理。
 */
function pageUrl(p){
  const f = (p && p.file) || "";
  if (/^(blob:|data:|https?:|\/)/i.test(f)) return f;
  return "data/" + f;
}

/* ---------- 渲染 ---------- */
function render(){
  const n = state.pages.length;
  const lane = laneSlots(state.dir, n);   // domSlot -> srcIdx
  const frag = document.createDocumentFragment();

  // DOM 顺序 = 格子顺序（从左到右）。每个格子放哪一页由 lane 决定。
  lane.forEach((srcIdx, slot) => {
    const p = state.pages[srcIdx];
    const wrap = document.createElement("div");
    wrap.className = "page";
    wrap.dataset.src = String(srcIdx);    // 这个格子装的是第几页（0 基）
    wrap.dataset.slot = String(slot);

    const sheet = document.createElement("div");
    sheet.className = "sheet";
    sheet.style.height = state.fitHeight + "px";
    // 按原始宽高比预留宽度，不等图片下载完。清单 / pdf.js / 图片导入
    // 都会带上 w、h，所以这里基本总能算出来；万一带不上就退回让图片自己撑。
    const ar = (p.w && p.h) ? (p.w / p.h) : 0;
    if (ar > 0){
      sheet.dataset.ar = String(ar);            // applyScale 换缩放时还要用
      sheet.style.width = Math.round(state.fitHeight * ar) + "px";
    }

    const img = document.createElement("img");
    img.alt = p.label || ("第 " + (srcIdx + 1) + " 页");
    img.decoding = "async";
    img.draggable = false;
    // 高分辨率扫描件靠浏览器原生缩放，不做任何二次采样，画质不被削弱
    img.loading = "eager";
    // PDF 懒渲染：还没轮到渲染的页先摆个带转圈的空架子，
    // 宽高比已经预留好，渲染完成后 paintPage 会补上图，布局不跳。
    if (p.pending){
      sheet.classList.add("pending");
      img.style.visibility = "hidden";
    }else{
      img.src = pageUrl(p);
    }

    sheet.appendChild(img);

    const num = document.createElement("div");
    num.className = "pnum";
    num.textContent = "第 " + (srcIdx + 1) + " 页";   // 页标按语义页码，不按格子号
    sheet.appendChild(num);

    wrap.appendChild(sheet);
    frag.appendChild(wrap);
  });

  track.innerHTML = "";
  track.appendChild(frag);
  // 聚焦模式在方向切换 / 换书重渲染后依然有效
  markFocusPage();
}

/* ---------- 定位 ---------- */
/** 当前页（语义页码 state.idx）在 DOM 里的格子元素 */
function currentEl(){
  return pageEl(state.idx);
}

function targetX(){
  const stageW = stage.clientWidth;

  // 聚焦模式：对准聚焦范围（一页，或当前跨的两页）的**整体中心**，
  // 让"清晰的页"始终停在阅读器正中。
  // 两页聚焦时翻页若仍以单页为中心，同一跨会在屏上左右小幅挪动；
  // 以整跨中点定位后，同跨内翻页画面保持稳定，换跨才整体平移一次。
  if (state.focus){
    const els = focusPageSet().map((n) => pageEl(Number(n))).filter(Boolean);
    if (els.length){
      let lo = Infinity, hi = -Infinity;
      for (const el of els){
        lo = Math.min(lo, el.offsetLeft);
        hi = Math.max(hi, el.offsetLeft + el.offsetWidth);
      }
      return -(track.offsetLeft + (lo + hi) / 2 - stageW / 2);
    }
  }

  const el = currentEl();
  if (!el) return 0;
  // 坐标基准要对齐，否则会整整偏出一大截。
  //
  // #track 上有 will-change:transform，它因此成了包含块，于是
  // el.offsetLeft 是相对**轨道**量的，不含轨道自己在舞台里的位置。
  // 而内容比舞台宽时，main 的 justify-content:center 会把轨道摆到负位置
  // （6 页的书实测 -643px）。漏掉这一段，当前页就会被推到左边、露出
  // 一大片空白 —— 这就是"第一页不在该在的位置"的来源。
  const x = track.offsetLeft + el.offsetLeft + el.offsetWidth / 2 - stageW / 2;
  return -x;
}

function alignToCurrent(animate){
  // 缩放模式下由滚动条定位，不要再平移轨道
  if (isZoomed()) return;
  track.classList.toggle("instant", !animate);
  track.style.transform = "translate3d(" + targetX() + "px,0,0)";
  if (!animate){
    // 强制回流后再恢复过渡，避免下一帧动画从错误位置开始
    void track.offsetHeight;
    track.classList.remove("instant");
  }
}

/* ---------- 导航 ---------- */
/**
 * 跳到第 pageNo 页（1 基的语义页码）。
 * next() / prev() 都汇到这里，两种装帧方向共用同一套语义。
 */
function goTo(pageNo, animate = true){
  const total = state.pages.length;
  if (!total) return;
  const clamped = Math.max(0, Math.min(total - 1, pageNo));
  state.idx = clamped;

  // 这是程序化跳页，位置由我们说了算：
  // 解除"用户已接管滚动位置"的状态，让后续布局变化仍会把他要看的这一页贴正。
  userOwnsScroll = false;

  // 翻书模式没有轨道可平移：直接把这张纸摆上来（滑块/跳转/缩略图都汇到这里）
  if (bookMode()){
    layoutBook();
    updateChrome();
    markThumb();
    return;
  }

  if (isZoomed()){
    scrollCurrentIntoView(animate);
  } else {
    alignToCurrent(animate);
  }
  updateChrome();
  markThumb();
}

/** 下一页 = 语义页码 +1（往后读一页），与装帧方向无关 */
function next(){
  if (bookMode()){ bookFlip(1); return; }
  if (state.idx >= state.pages.length - 1){ bump(1); return; }
  goTo(state.idx + 1);
}

/** 上一页 = 语义页码 -1 */
function prev(){
  if (bookMode()){ bookFlip(-1); return; }
  if (state.idx <= 0){ bump(-1); return; }
  goTo(state.idx - 1);
}

/** 到头时给一点回弹提示，dir 表示被挡住的推进方向 */
function bump(dir){
  const dx = dir > 0 ? -7 : 7;
  stage.animate(
    [{ transform:"translateX(0)" }, { transform:`translateX(${dx}px)` }, { transform:"translateX(0)" }],
    { duration:180, easing:"ease-out" }
  );
}

/* ===================================================================
   翻书模式 —— 一屏摊开一「跨」，像一本摊在桌上的书
     - 跨（cross）是布局单位，一屏正好一跨：
         · 对开页（源图宽高比 >= 1.15，即 PDF 一页里就印着左右两面书）
           独占一跨、整张居中铺开 —— 绝不拆开，拆开会打乱原书顺序；
         · 单页扫描两两配成一跨：右开本先读页在右、次读页在左
           （左开本反之），两侧都有纸，和实体书摊在桌上一样；
         · 全书只有一页时整张居中，像一张纸平放在桌上。
     - 任何一页都是完整原页：不裁切、不旋转、不重排。
     - 页码 state.idx 与连续模式一一对应（指向跨内首页）；
       翻一次跨，跨内顺序永远跟随源文件。
   =================================================================== */
const VIEW_KEY = "gushi-reader-view";
const BOOK_SPREAD_AR = 1.15;   // 宽高比达到该值视为「一页含左右两面」的对开扫描
const BOOK_MARGIN = 14;        // 纸与窗口边缘的留白
const BOOK_SPINE_GAP = 3;      // 纸的装订缘与书脊之间的细缝

function bookMode(){ return state.view === "book" && state.ready; }
function isSpreadPage(p){ return !!(p && p.w && p.h && (p.w / p.h) >= BOOK_SPREAD_AR); }
function bookRTL(){ return state.dir === "right-to-left"; }

/** 第 i 页的宽高比；尺寸未知时给个古籍常见的窄长条比例 */
function arOf(i){
  const p = state.pages[i];
  return (p && p.w && p.h) ? (p.w / p.h) : 0.7;
}

/** 把页面切成「跨」：对开页独占一跨，相邻单页两两配跨 */
function buildCrosses(){
  const n = state.pages.length;
  const out = [];
  let i = 0;
  while (i < n){
    if (isSpreadPage(state.pages[i])){
      out.push({ kind: "full", pages: [i] });
      i += 1;
    } else if (i + 1 < n && !isSpreadPage(state.pages[i + 1])){
      out.push({ kind: "pair", pages: [i, i + 1] });
      i += 2;
    } else {
      out.push({ kind: "single", pages: [i] });   // 落单页（含与对开页相邻者）
      i += 1;
    }
  }
  return out;
}

/** 跨列表（按页数缓存；换书 / 重新导入时由 invalidateCrosses 清空） */
function crosses(){
  if (!state._crosses || state._crossesFor !== state.pages.length){
    state._crosses = buildCrosses();
    state._crossesFor = state.pages.length;
  }
  return state._crosses;
}
function invalidateCrosses(){ state._crosses = null; state._crossesFor = -1; }

/** 第 pageIdx 页落在第几跨 */
function crossIndexAt(pageIdx){
  const cs = crosses();
  for (let k = 0; k < cs.length; k++){
    const ps = cs[k].pages;
    if (pageIdx >= ps[0] && pageIdx <= ps[ps.length - 1]) return k;
  }
  return 0;
}

/**
 * 算一跨怎么摆：返回 { H, items:[{slot,idx,left,w}] }，slot ∈ "L" | "F" | "R"。
 * 每页按自身宽高比缩放，绝不拉伸；纸高统一为 H，纸宽各自随比例，
 * 因此两张不同开本的扫描页并排时也不会变形。
 */
function planCross(cross, W, baseH){
  const spineX = W / 2;
  const rtl = bookRTL();
  const items = [];
  let H = baseH;

  if (cross.kind === "full" || state.pages.length === 1){
    // 整张：居中铺开（对开扫描 / 全书仅一页）
    const a = arOf(cross.pages[0]);
    const avail = Math.max(120, W - BOOK_MARGIN * 2);
    if (a * H > avail) H = Math.max(140, Math.floor(avail / a));
    const w = H * a;
    items.push({ slot: "F", idx: cross.pages[0], left: Math.round(spineX - w / 2), w: Math.round(w) });
    return { H, spineX, rtl, items };
  }

  // 配对 / 落单：每张纸贴书脊，宽度受半屏约束
  const availHalf = Math.max(110, W / 2 - BOOK_MARGIN - BOOK_SPINE_GAP);
  const ars = cross.pages.map((i) => arOf(i));
  ars.forEach((a) => { if (a * H > availHalf) H = Math.max(120, Math.floor(availHalf / a)); });

  cross.pages.forEach((idx, k) => {
    const w = H * ars[k];
    const first = (k === 0);                 // 先读页
    const onRight = first ? rtl : !rtl;      // 右开本：先读页在右；左开本反之
    const left = onRight ? (spineX + BOOK_SPINE_GAP) : (spineX - BOOK_SPINE_GAP - w);
    items.push({ slot: onRight ? "R" : "L", idx, left: Math.round(left), w: Math.round(w) });
  });
  return { H, spineX, rtl, items };
}

/** 把一个 leaf 藏起来（移出视野，同时断开图片） */
function hideLeaf(el){
  el._leafIdx = -1;
  el.style.display = "none";
  const im = el.querySelector("img");
  if (im) im.removeAttribute("src");
}

/** 把第 idx 页摆进一个 leaf 容器；未渲染的页先转圈，渲染完就地补图 */
function fillLeaf(el, idx, rect){
  const p = state.pages[idx];
  el._leafIdx = idx;
  el.style.display = "";
  el.style.left = rect.left + "px";
  el.style.width = rect.w + "px";
  el.style.height = rect.h + "px";
  let img = el.querySelector("img");
  if (!img){
    img = document.createElement("img");
    img.decoding = "async";
    img.draggable = false;
    el.appendChild(img);
  }
  el.classList.toggle("pend", !!p.pending && !p._failed);
  el.classList.toggle("pend-fail", !!p._failed);
  if (p.pending && !p._failed){
    img.removeAttribute("src");
    // paintPage 只管连续模式的轨道，翻书模式的槽位自己补图。
    // 回填前核对 _leafIdx：动画期间容器可能已被挪作别的页。
    ensurePageRendered(idx).then(() => {
      if (el._leafIdx !== idx) return;
      const np = state.pages[idx];
      el.classList.toggle("pend", !!np.pending && !np._failed);
      el.classList.toggle("pend-fail", !!np._failed);
      if (!np.pending && !np._failed) img.src = pageUrl(np);
      else img.removeAttribute("src");
    }).catch(() => {});
  } else {
    // 渲染失败的页没有可用的图（file 还是空串），别喂 "data/" 进去
    if (p.pending || p._failed) img.removeAttribute("src");
    else img.src = pageUrl(p);
  }
}

/** 摆好当前这一跨（无动画的静态布局；模式切换/跳页/换书/改方向都走这里） */
function layoutBook(){
  if (!bookMode() || !state.pages.length) return;
  const area = $("bookArea");
  const W = Math.max(320, stage.clientWidth);
  const baseH = Math.max(200, stage.clientHeight - 84);
  const cross = crosses()[crossIndexAt(state.idx)];
  const plan = planCross(cross, W, baseH);

  area.style.width = W + "px";
  area.style.height = plan.H + "px";
  area.dataset.kind = cross.kind;

  paintCross(cross, plan);
  paintGutter(cross, plan, W);
  paintBookNum(cross);
}

/** 把一跨的纸铺到静态层：对开页占整张槽，配对的两页分占左右槽 */
function paintCross(cross, plan){
  const L = $("bookL"), R = $("bookR"), F = $("bookFull");
  hideLeaf(L); hideLeaf(R); hideLeaf(F);
  plan.items.forEach((it) => {
    const el = it.slot === "F" ? F : (it.slot === "L" ? L : R);
    fillLeaf(el, it.idx, { left: it.left, w: it.w, h: plan.H });
  });
}

/** 书脊阴影：双侧有纸（整张/配对）压在正中，落单页贴在它靠书脊的那条边 */
function paintGutter(cross, plan, W){
  const g = $("bookGutter");
  const slot0 = plan.items.length ? plan.items[0].slot : "F";
  if (cross.kind === "pair" || slot0 === "F"){
    g.className = "g-spread";
    g.style.left = (W / 2 - 24) + "px";
    g.style.width = "48px";
  } else if (slot0 === "R"){          // 纸在右半：装订侧是它的左缘
    g.className = "g-in";
    g.style.left = (W / 2 - 6) + "px";
    g.style.width = "30px";
  } else {                             // 纸在左半：装订侧是它的右缘
    g.className = "g-out";
    g.style.left = (W / 2 - 24) + "px";
    g.style.width = "30px";
  }
}

/** 页码：一屏一跨，配对页报出跨内页序范围（如「第 3–4 页」） */
function paintBookNum(cross){
  const total = state.pages.length;
  const ps = cross.pages;
  const a = ps[0] + 1, b = ps[ps.length - 1] + 1;
  const span = (a === b) ? ("第 " + a + " 页") : ("第 " + a + "–" + b + " 页");
  $("bookNum").textContent = span + " / 共 " + total + " 页";
}

/** 带超时地等一个 Promise（翻页不能被渲染慢的页卡死） */
function withTimeout(pr, ms){
  return Promise.race([ Promise.resolve(pr), new Promise((r) => setTimeout(r, ms)) ]);
}

let flipBusy = false;
let queuedFlip = 0;   // 动画期间记下的最后一次翻页请求，结束后补上

/** 把某一页摆到书脊的指定一侧（翻页动画期间按「侧」摆纸用） */
function paintSide(slot, idx, W, H){
  if (idx < 0 || idx >= state.pages.length) return;
  const w = Math.round(H * arOf(idx));
  const spineX = W / 2;
  const left = slot === "R" ? (spineX + BOOK_SPINE_GAP)
                            : (spineX - BOOK_SPINE_GAP - w);
  fillLeaf(slot === "R" ? $("bookR") : $("bookL"), idx, { left: Math.round(left), w, h: H });
}

/**
 * 翻一跨（带动画）。dirSign = +1 往后翻 / -1 往回翻。
 *   配对跨之间：把「先读侧」那张纸绕书脊翻到另一侧 ——
 *     前进：当前跨的先读页（右开本在右）翻向左边，纸背正好是目标跨的
 *           次读页，被它让出的位置露出目标跨的先读页；
 *     后退：同一张纸反着转回去，正面重新出现。
 *   涉及对开页（整张占满一跨、横跨书脊）时不走 3D：那种纸比半屏还宽，
 *   绕书脊转会甩出画面，直接用淡换，干净且不误导。
 */
async function bookFlip(dirSign){
  if (!bookMode()) return;
  if (flipBusy){ queuedFlip = dirSign; return; }
  const cs = crosses();
  const cur = crossIndexAt(state.idx);
  const nextCross = cur + dirSign;
  if (nextCross < 0 || nextCross >= cs.length){ bump(dirSign); return; }
  const forward = dirSign > 0;
  const from = cs[cur], to = cs[nextCross];

  flipBusy = true;
  // 两跨的纸先就绪，免得翻过去只看到转圈。本地 blob 渲染通常几十毫秒，
  // 慢页最多等 1.6s，不把动画卡死
  try{
    await withTimeout(Promise.all(from.pages.concat(to.pages).map((i) => ensurePageRendered(i))), 1600);
  }catch(e){}
  if (!bookMode()){ flipBusy = false; return; }

  const finishBusy = () => {
    flipBusy = false;
    if (queuedFlip && bookMode()){
      const q = queuedFlip; queuedFlip = 0;
      bookFlip(q);
    } else {
      queuedFlip = 0;
    }
  };
  const settle = () => {
    state.idx = to.pages[0];
    layoutBook();      // 以目标跨的正式布局收尾（含书脊阴影、页码）
    updateChrome();
    markThumb();
    finishBusy();
  };

  // 含对开页的跨：淡换
  if (from.kind === "full" || to.kind === "full"){
    const area = $("bookArea");
    const wrap = $("bookFlipWrap");
    wrap.classList.remove("anim");
    wrap.style.left = "-9999px";
    area.style.transition = "opacity .16s ease";
    area.style.opacity = "0";
    setTimeout(() => {
      state.idx = to.pages[0];
      layoutBook();
      updateChrome();
      markThumb();
      area.style.opacity = "1";
      setTimeout(() => { area.style.transition = ""; finishBusy(); }, 180);
    }, 170);
    return;
  }

  const area = $("bookArea");
  const W = area.clientWidth || stage.clientWidth;
  const baseH = Math.max(200, stage.clientHeight - 84);
  const toPlan = planCross(to, W, baseH);
  const H = toPlan.H;
  const rtl = bookRTL();
  const spineX = W / 2;
  const idxOf = (cross, k) => (cross.pages[k] === undefined ? -1 : cross.pages[k]);

  // 静态层：先读侧直接摆目标跨的先读页（纸让开就露出它）；
  // 次读侧前进时留着旧页等纸盖上来，后退时先摆目标页等纸翻走露出来
  const L = $("bookL"), R = $("bookR"), F = $("bookFull");
  hideLeaf(L); hideLeaf(R); hideLeaf(F);
  const firstSlot = rtl ? "R" : "L";
  const secondSlot = rtl ? "L" : "R";
  paintSide(firstSlot, idxOf(to, 0), W, H);
  paintSide(secondSlot, forward ? idxOf(from, 1) : idxOf(to, 1), W, H);

  // 翻动的那张纸：一律按目标跨先读页的尺寸，落在先读位
  const paperW = Math.max(1, Math.round(H * arOf(to.pages[0])));
  const wrapLeft = rtl ? (spineX + BOOK_SPINE_GAP)
                       : (spineX - BOOK_SPINE_GAP - paperW);
  const wrap = $("bookFlipWrap");
  const flip = wrap.querySelector(".flip");
  const front = flip.querySelector(".face.front");
  const back = flip.querySelector(".face.back");
  front.innerHTML = ""; back.innerHTML = "";

  const frontIdx = forward ? idxOf(from, 0) : idxOf(to, 0);
  const backIdx = forward ? idxOf(to, 1) : idxOf(from, 1);
  [[front, frontIdx], [back, backIdx]].forEach(([face, i]) => {
    if (i < 0) return;
    const p = state.pages[i];
    if (p.pending || p._failed) return;
    const im = document.createElement("img");
    im.draggable = false;
    im.src = pageUrl(p);
    face.appendChild(im);
  });

  wrap.style.left = wrapLeft + "px";
  wrap.style.width = paperW + "px";
  wrap.style.height = H + "px";

  // 纸的转轴永远在书脊上（先读位的装订缘），转过来正好落在另一侧
  const advance = rtl ? -180 : 180;
  flip.style.transformOrigin = (rtl ? "0%" : "100%") + " 50%";
  flip.style.transform = "rotateY(" + (forward ? 0 : advance) + "deg)";

  const finish = () => {
    wrap.classList.remove("anim");
    wrap.style.left = "-9999px";
    front.innerHTML = ""; back.innerHTML = "";
    settle();
  };

  // 先以初始角摆好（无过渡），下一帧再挂过渡类转到目标角
  void flip.offsetHeight;
  wrap.classList.add("anim");
  flip.style.transform = "rotateY(" + (forward ? advance : 0) + "deg)";
  setTimeout(finish, 620);   // 比过渡略长，不依赖 transitionend 的时序可靠性
}

/** 切换 连续滚动 / 翻书 视图 */
function setViewMode(mode){
  const toBook = mode === "book";
  if ((state.view === "book") === toBook) return;
  state.view = toBook ? "book" : "scroll";
  try{ localStorage.setItem(VIEW_KEY, state.view); }catch(e){}
  document.body.dataset.view = state.view;
  $("btnView").setAttribute("aria-pressed", String(toBook));
  if (!state.ready) return;

  if (toBook){
    // 翻书视图按适应高度摆纸，不吃缩放：切进来先把缩放态收掉
    if (isZoomed()){
      state.zoom = 1;
      stage.classList.remove("zoomed");
      stage.scrollLeft = 0;
      applyScale();
    }
    layoutBook();
    updateChrome();
    flash("翻书模式：点两侧翻页，B 键退出");
  } else {
    // 回到连续轨道，把当前页重新贴到正中
    requestAnimationFrame(() => { if (!isZoomed()) alignToCurrent(false); });
  }
}
function toggleViewMode(){ setViewMode(state.view === "book" ? "scroll" : "book"); }

function updateChrome(){
  const total = state.pages.length;
  const cur = total ? state.idx + 1 : 0;
  pageLabel.innerHTML = "<b>" + cur + "</b> / " + total;
  slider.max = String(Math.max(0, total - 1));
  slider.value = String(state.idx);

  // 到头判断：连续模式看页码，翻书模式看「跨」（一屏可能含两页）
  let atStart = state.idx <= 0, atEnd = state.idx >= total - 1;
  if (bookMode() && total){
    const cs = crosses();
    const k = crossIndexAt(state.idx);
    atStart = k <= 0;
    atEnd = k >= cs.length - 1;
  }
  btnPrev.disabled = atStart;
  btnNext.disabled = atEnd;

  // 翻到哪就先把哪页（含相邻页）渲染出来；后台队列会被它插队
  requestPagesAround(state.idx);

  // 聚焦模式：当前页变了，清晰页也要跟着挪
  markFocusPage();

  // 顺手把「读到哪了」写回历史。用防抖是因为快速翻页时
  // updateChrome 会被高频调用，而 localStorage 是同步 IO。
  scheduleBookmark();
}

/** 防抖写入当前书的进度（300ms 内的连续翻页只写一次） */
let bookmarkTimer = 0;
function scheduleBookmark(){
  clearTimeout(bookmarkTimer);
  bookmarkTimer = setTimeout(touchCurrentBook, 300);
}

/* ---------- 缩略图 ---------- */
function buildThumbs(){
  thumbStrip.innerHTML = "";
  const frag = document.createDocumentFragment();
  // 缩略图按语义页码排列（第1页在最前），方便定位；点击直接跳到该页
  state.pages.forEach((p, srcIdx) => {
    const d = document.createElement("div");
    d.className = "t";
    d.dataset.src = String(srcIdx);
    d.title = "第 " + (srcIdx + 1) + " 页";
    const im = document.createElement("img");
    // 未渲染的 PDF 页先不给 src，等 paintPage 补上（否则会是破图）
    if (!p.pending) im.src = pageUrl(p);
    im.loading = "lazy";
    im.alt = d.title;
    d.appendChild(im);
    d.addEventListener("click", () => goTo(srcIdx));
    frag.appendChild(d);
  });
  thumbStrip.appendChild(frag);
  markThumb();
}

function markThumb(){
  thumbStrip.querySelectorAll(".t.cur").forEach((e) => e.classList.remove("cur"));
  const t = thumbStrip.querySelector('.t[data-src="' + state.idx + '"]');
  if (t){
    t.classList.add("cur");
    if (thumbs.classList.contains("open")){
      t.scrollIntoView({ block:"nearest", inline:"center", behavior:"smooth" });
    }
  }
}

/* ---------- 方向切换 ---------- */
/**
 * 应用装帧方向。
 * 只改变「第 1 页摆在哪一端」，不改变语义页码，也不改变按钮指向。
 * @param {string} dir      目标方向
 */
function setDirection(dir){
  if (!state.pages.length){ state.dir = dir; return; }
  state.dir = dir;

  const rtl = dir === "right-to-left";
  dirRTL.setAttribute("aria-pressed", String(rtl));
  dirLTR.setAttribute("aria-pressed", String(!rtl));
  dirHint.textContent = rtl ? "右开本 · 第1页在右" : "左开本 · 第1页在左";
  // 滚动提示里的方向词也要跟着改
  if (isZoomed()) $("zoomHint").textContent = rtl ? "滚动条从右向左拖" : "滚动条从左向右拖";

  // 重排轨道后仍停在同一个语义页码上
  render();
  buildThumbs();
  updateChrome();
  // 翻书模式下换方向，纸张的摆位（书脊一侧、阴影方向）要跟着重算
  if (bookMode()) layoutBook();

  // 换了装帧方向，滚动条的方向也跟着换：右开本要从最右端起步
  requestAnimationFrame(() => {
    if (isZoomed()){
      resetScrollStart();
      scrollCurrentIntoView(false);
    } else {
      alignToCurrent(false);
    }
  });
}

/* ---------- 载入 ---------- */
async function boot(){
  // 控制台落款（彩蛋线索）
  try {
    console.log(
      "%c右翻书古籍阅读器%c\nDeveloped by liweiyuan\n\n小提示：试试连续键入我的名字 :)",
      "font:bold 20px 'KaiTi',serif;color:#c0392b;",
      "font:12px sans-serif;color:#888;"
    );
  } catch(e){}

  // 环境自检：入口地址、存储可持久性。不阻塞界面，先亮起来再说。
  try{ initEnv(); }catch(e){}

  // 阅读底色：先恢复上次选择，再渲染列表。
  // 放在最前面，空状态页也能用底色功能。
  buildThemeList();
  let savedTheme = null;
  try { savedTheme = localStorage.getItem(THEME_KEY); } catch(e){}
  applyTheme(savedTheme || "paper");

  // 聚焦模式：恢复上次的选择（开/关 + 范围一页或两页）
  let savedFocus = "0", savedScope = "1";
  try { savedFocus = localStorage.getItem(FOCUS_KEY) || "0"; } catch(e){}
  try { savedScope = localStorage.getItem(FOCUS_SCOPE_KEY) || "1"; } catch(e){}
  state.focusScope = savedScope === "2" ? "2" : "1";
  setFocusMode(savedFocus === "1");

  // 视图模式：恢复上次是连续滚动还是翻书
  let savedView = "scroll";
  try { savedView = localStorage.getItem(VIEW_KEY) || "scroll"; } catch(e){}
  state.view = savedView === "book" ? "book" : "scroll";
  document.body.dataset.view = state.view;
  $("btnView").setAttribute("aria-pressed", String(state.view === "book"));

  $("loading").classList.add("show");
  let mf = null;
  try{
    const res = await fetch(DATA_URL, { cache:"no-store" });
    if (res.ok) mf = await res.json();
  }catch(e){ /* 常见于 file:// 直接打开时的跨域限制 */ }

  // 兜底：用 <script> 引入的清单副本。file:// 下 fetch() 一定失败，
  // 但 script 标签不受此限，所以双击打开也能看到演示库，而不是一片空。
  if ((!mf || !mf.pages || !mf.pages.length) && window.__GUSHI_MANIFEST){
    mf = window.__GUSHI_MANIFEST;
  }

  if (!mf || !mf.pages || !mf.pages.length){
    $("loading").classList.remove("show");
    $("empty").classList.add("show");
    adviceForFileMode();     // 双击打开又读不到库：把该怎么做说清楚
    return;
  }

  // 磁盘模式的书籍：页面是相对路径，可以凭 manifest 地址直接重新打开，
  // 所以连同地址一起记进历史。id 用固定值，保证同一本书只有一条记录。
  const bookId = "local:" + mf.title;

  // 先取出"上次读到哪一页"，再 applyManifest —— 后者会把 state 重置。
  // 以前这里写死 page: 1，等于每次打开/刷新都把进度抹掉，
  // 「最近打开」里的页码就永远停在 1/6，续读形同虚设。
  const prevRec = readHistory().find((it) => it.id === bookId) || null;
  const resumePage = prevRec && prevRec.page > 1
    ? Math.min(prevRec.page, mf.pages.length)
    : 1;

  applyManifest(mf, { bookId: bookId });
  rememberBook({
    id: bookId,
    name: mf.title || "右翻书古籍阅读器",
    kind: "local",
    src: DATA_URL,
    total: mf.pages.length,
    page: resumePage,
    dir: state.dir,
    theme: state.theme,
  });

  // 接着上次的位置读下去，而不是每次都从第 1 页重新开始
  if (resumePage > 1){
    requestAnimationFrame(() => goTo(resumePage - 1, false));
    flash("已回到第 " + resumePage + " 页");
  }
}

/* ---------- 应用一份 manifest 并开始阅读 ---------- */
function applyManifest(mf, opts){
  const o = opts || {};
  // 关键：manifest 里的 pages 数组必须是「第 1 页在前」的自然顺序。
  // 显示时的左右摆位由 laneSlots() 依据装帧方向处理，不在这里调整顺序。
  state.pages = mf.pages;
  invalidateCrosses();           // 换了书：翻书模式的「跨」划分要重算
  state.title = mf.title || "右翻书古籍阅读器";
  state.bookId = o.bookId || "";
  // 优先沿用页面上当前选择的装帧方向（用户可能手动切过），
  // 其次参考 manifest 记录的方向。
  if (!state.userPickedDir){
    state.dir = mf.direction === "left-to-right" ? "left-to-right" : "right-to-left";
  }

  $("bookTitle").textContent = state.title;
  // 应用名放最前：浏览器标签页宽度有限会截断标题，
  // 放在前面才能保证「右翻书古籍阅读器」始终可见。
  document.title = "右翻书古籍阅读器 · " + state.title;

  // 同步顶栏的装帧方向按钮
  const rtl = state.dir === "right-to-left";
  dirRTL.setAttribute("aria-pressed", String(rtl));
  dirLTR.setAttribute("aria-pressed", String(!rtl));
  dirHint.textContent = rtl ? "右开本 · 第1页在右" : "左开本 · 第1页在左";

  state.idx = 0;                 // 永远从第 1 页开始
  state.zoom = 1;
  stage.classList.remove("zoomed");
  stage.scrollLeft = 0;
  computeFitHeight();
  render();
  buildThumbs();
  updateChrome();
  requestAnimationFrame(() => alignToCurrent(false));

  $("loading").classList.remove("show");
  $("empty").classList.remove("show");
  state.ready = true;
  // 上次退出时用的是翻书模式：新书一开门就进对开视图。
  // rAF 在被节流的后台标签页里可能迟迟不来，再补一个 setTimeout 兜底
  if (state.view === "book"){
    requestAnimationFrame(layoutBook);
    setTimeout(() => { if (state.view === "book" && state.ready) layoutBook(); }, 150);
  }
}

/* ===================================================================
   本机文件导入
   全部在浏览器内完成：PDF 用 pdf.js 解析，图片用原始 File 对象，
   不经过任何服务器，文件不会被上传。
   =================================================================== */

// PDF 解析库：优先用随程序自带的本地副本（vendor/pdfjs/），
// 断网、内网、CDN 被墙的环境都能用；本地副本缺失时才退回 CDN。
// 早先是"只用 CDN"，一旦 cdnjs 连不上就表现为"导入 PDF 后什么都没有"。
const PDFJS_LOCAL = "vendor/pdfjs/pdf.min.js";
const PDFJS_LOCAL_WORKER = "vendor/pdfjs/pdf.worker.min.js";
const PDFJS_CDN = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
const PDFJS_CDN_WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let pdfjsReady = null;
let pdfjsSource = "未加载";   // 本地 / CDN / 内存，供诊断

/** 插一个 <script>，成功与否都用布尔回报（不抛异常） */
function loadScript(src){
  return new Promise((resolve) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = () => resolve(!!window.pdfjsLib);
    s.onerror = () => resolve(false);
    document.head.appendChild(s);
  });
}

/** 探测某个 URL 是否取得到（只有 http/https 下能探；file:// 直接放行） */
async function urlReachable(url){
  if (!/^https?:$/.test(location.protocol)) return true;
  try{
    const r = await fetch(url, { method: "HEAD", cache: "no-store" });
    return r.ok;
  }catch(e){ return false; }
}

function ensurePdfjs(){
  if (pdfjsReady) return pdfjsReady;
  pdfjsReady = (async () => {
    if (window.pdfjsLib){
      pdfjsSource = "预载";      // 页面 <script> 已经引了（正常是本地副本）
    } else if (await loadScript(PDFJS_LOCAL)){
      pdfjsSource = "本地";
    } else if (await loadScript(PDFJS_CDN)){
      pdfjsSource = "CDN";
    } else {
      throw new Error(
        "PDF 解析库没能载入。\n" +
        "本地文件 vendor/pdfjs/pdf.min.js 没找到（请确认随程序一起拷贝过来），" +
        "同时云端 CDN 也连不上（可能是断网或被拦截）。\n" +
        "把 vendor 目录补齐，或联网后重试即可。"
      );
    }
    // worker 同理：本地在就用本地，否则退回 CDN
    const useLocalWorker = await urlReachable(PDFJS_LOCAL_WORKER);
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = useLocalWorker ? PDFJS_LOCAL_WORKER : PDFJS_CDN_WORKER;
    if (!useLocalWorker) pdfjsSource += " + CDN worker";
    return window.pdfjsLib;
  })();
  // 失败不留缓存：网络恢复后再点一次导入就能成，而不是一次失败永久坏掉
  pdfjsReady.catch(() => { pdfjsReady = null; });
  return pdfjsReady;
}

function setProgress(text, ratio, sub){
  const p = $("progress");
  p.classList.add("on");
  $("progText").textContent = text;
  $("progBar").style.width = Math.round(Math.max(0, Math.min(1, ratio)) * 100) + "%";
  $("progSub").textContent = sub || "";
}
function hideProgress(){ $("progress").classList.remove("on"); }

/* --- 把 PDF 变成书页 --- */
/**
 * 解析 PDF（快，秒级）。
 *
 * 这里只做两件事：解析文档结构、读取每页的几何尺寸（宽高比），
 * **不做任何像素渲染**。真正的渲染由懒渲染管理器按需进行——
 * 用户翻到哪页才渲染哪页，其余页面由后台队列慢慢补齐。
 * 之前是整本全部渲染完才开门，80 页的书要干等一两分钟。
 *
 * 每页带一个 _render() 闭包，捕获 pdf.js 文档对象和页号，
 * 由管理器在合适的时机调用。文档对象必须保持存活直到这本书被换掉
 * （换书时由 disposeBookRenderers 统一销毁）。
 */
async function loadPdf(file, onProgress){
  const pdfjsLib = await ensurePdfjs();
  onProgress(0, 1, "正在打开 PDF");
  const buf = await file.arrayBuffer();
  const doc = await pdfjsLib.getDocument({
    data: buf,
    // 关掉用不上的功能，降低内存占用
    disableAutoFetch: true,
    disableStream: true,
  }).promise;
  RENDER.docs.push(doc);

  const total = doc.numPages;
  // 扫描件常见 200~400 DPI。按页面尺寸推断倍率：
  // 页面宽度(pt) × scale / 72 = 目标 DPI。取 300 DPI 对应的倍率。
  const TARGET_DPI = 300;
  const MAX_SCALE = 5;      // 上限，避免超大页面撑爆内存
  const baseScale = Math.max(1, Math.min(MAX_SCALE, TARGET_DPI / 72));
  const pages = [];

  for (let i = 1; i <= total; i++){
    onProgress(i, total, "正在解析第 " + i + " / " + total + " 页");
    // 只读页面几何信息（宽高比用于预留摆位），不渲染像素。
    // getPage 只解析页面字典，代价很小；真正耗时的像素渲染被推迟了。
    let dim = { w: 595, h: 842 };   // 拿不到几何信息时按 A4 比例兜底
    try{
      const page = await doc.getPage(i);
      const base = page.getViewport({ scale: 1 });
      dim = { w: Math.max(1, Math.round(base.width)), h: Math.max(1, Math.round(base.height)) };
      try{ page.cleanup(); }catch(e){}
    }catch(e){ /* 单页几何失败不致命，摆位先用兜底比例 */ }

    pages.push({
      file: "",             // 尚未渲染；渲染完成后由管理器填入 blob URL
      pending: true,        // 占位标记，render() 据此画"渲染中"占位
      label: "第 " + i + " 页",
      w: dim.w, h: dim.h,
      source: file.name + "#" + i,
      _render: () => renderPdfPage(doc, i, baseScale),
    });
  }
  // 文档对象随结果带回，开门后由 disposeBookRenderers 统一接管生命周期
  pages.pdfDoc = doc;
  return pages;
}

/**
 * 渲染 PDF 的某一页为无损 PNG。
 *
 * 关键设计与整本渲染时代相同（防"翻到几十页后空白"）：
 * 1. 不调用 page.getOperatorList()（内存杀手）；
 * 2. canvas 用完尺寸归零，让浏览器回收；
 * 3. page.cleanup() 释放 pdf.js 内部缓存。
 * 现在每次只渲染一页，内存峰值比原来更低。
 */
async function renderPdfPage(doc, num, scale){
  const page = await doc.getPage(num);
  let viewport = page.getViewport({ scale });
  // 超大页保护：单页像素超过 16MP（4096²）就整体降采样。
  // 大部头扫描件（一两百页、300DPI）以前会按原尺寸逐页渲染，
  // 一张画布就是几十 MB，页数一多内存吃紧甚至把渲染进程压垮，
  // 表现成"页码在、内容全无"的静默空白。
  const MAX_RENDER_PX = 4096 * 4096;
  if (viewport.width * viewport.height > MAX_RENDER_PX){
    const k = Math.sqrt(MAX_RENDER_PX / (viewport.width * viewport.height));
    viewport = page.getViewport({ scale: scale * k });
  }
  const canvas = document.createElement("canvas");
  canvas.width = Math.max(1, Math.floor(viewport.width));
  canvas.height = Math.max(1, Math.floor(viewport.height));

  const ctx = canvas.getContext("2d", { alpha: false });
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 记录 canvas 尺寸，渲染后可能被 pdf.js 调整
  const cw = canvas.width, ch = canvas.height;

  try{
    await page.render({ canvasContext: ctx, viewport }).promise;

    // 输出格式按页面积挑：小页（≤4MP）用无损 PNG；
    // 大页用 JPEG（扫描件本身就是有损源，q0.9 看不出差别，
    // 体积只有 PNG 的十分之一上下）—— 124 页的书能省下大几百 MB 内存
    const mp = (cw * ch) / 1e6;
    const mime = mp > 4 ? "image/jpeg" : "image/png";
    const blob = await new Promise((r) => {
      try { canvas.toBlob(r, mime, mime === "image/jpeg" ? 0.9 : undefined); } catch(e){ r(null); }
    });
    if (blob && blob.size > 0){
      return { url: URL.createObjectURL(blob), w: cw, h: ch };
    }
    return null;   // 渲染成功但没有产出，按失败处理
  }finally{
    // 及时释放：尺寸归零后浏览器才能回收显存与内存
    canvas.width = 0;
    canvas.height = 0;
    try { page.cleanup(); } catch(e){}
  }
}

/* ---------- 懒渲染管理器 ---------- */
/**
 * PDF 页面不再在导入时全部渲染，而是：
 *   - 打开书时渲染当前那一页（importFiles 里 await）；
 *   - 翻到某页时，若该页（及相邻页）未渲染，立即渲染；
 *   - 其余页面由后台队列按顺序慢慢补齐，每页之间让出主线程。
 *
 * epoch 用于换书时让旧的后台循环自行退出，避免新旧两本书抢渲染。
 */
const RENDER = { docs: [], epoch: 0 };

/** 换书时销毁旧书的 pdf.js 文档（keep 里的属于新书，保留） */
function disposeBookRenderers(keep){
  RENDER.epoch++;
  const stale = keep ? RENDER.docs.filter((d) => !keep.includes(d)) : RENDER.docs.slice();
  RENDER.docs = keep ? keep.slice() : [];
  setTimeout(() => {
    stale.forEach((d) => { try{ d.destroy(); }catch(e){} });
  }, 0);
}

/** 渲染第 i 页（0 基）并就地更新 DOM。重复调用有 _rendering 守卫，安全 */
async function ensurePageRendered(i){
  const p = state.pages[i];
  if (!p || !p.pending || !p._render || p._rendering) return;
  p._rendering = true;
  try{
    const r = await p._render();
    if (r){
      // 渲染尺寸是等比缩放得来，比例一般不变；万一变了（换过渲染参数），
      // 「跨」的划分要跟着重算，否则对开页可能被判成单页
      const oldAR = (p.w && p.h) ? (p.w / p.h) : 0;
      p.file = r.url; p.w = r.w; p.h = r.h;
      if (oldAR && Math.abs((r.w / r.h) - oldAR) > 0.01) invalidateCrosses();
      p.pending = false;
      p._render = null;
      paintPage(i);
    }else{
      throw new Error("没有产出图像");
    }
  }catch(err){
    console.warn("第 " + (i + 1) + " 页渲染失败：", err);
    p.pending = false;
    p._failed = true;
    p._render = null;
    markPageFailed(i);
    flash("第 " + (i + 1) + " 页渲染失败");
  }finally{
    p._rendering = false;
  }
}

/** 一页渲染失败：占位转为"本页渲染失败"提示 */
function markPageFailed(i){
  const wrap = track.querySelector('.page[data-src="' + i + '"]');
  if (!wrap) return;
  const sheet = wrap.querySelector(".sheet");
  if (sheet){
    sheet.classList.remove("pending");
    sheet.classList.add("failed");
    const img = sheet.querySelector("img");
    if (img) img.style.visibility = "hidden";
  }
}

/** 一页渲染完成后，把它画进已经摆好的格子里（布局不变，只补图） */
function paintPage(i){
  const p = state.pages[i];
  if (!p || !p.file) return;
  const wrap = track.querySelector('.page[data-src="' + i + '"]');
  if (wrap){
    const sheet = wrap.querySelector(".sheet");
    const img = sheet.querySelector("img");
    if (sheet && img){
      sheet.classList.remove("pending", "failed");
      img.style.visibility = "";
      img.src = pageUrl(p);
    }
  }
  // 缩略图同步补上
  const thumb = thumbStrip.querySelector('.t[data-src="' + i + '"] img');
  if (thumb && !thumb.getAttribute("src")) thumb.src = pageUrl(p);
}

/** 当前页与相邻页要优先渲染（翻页时立即触发） */
function requestPagesAround(idx){
  const total = state.pages.length;
  for (const i of [idx, idx + 1, idx - 1]){
    const p = state.pages[i];
    if (p && p.pending && !p._rendering){
      ensurePageRendered(i).catch(() => {});
    }
  }
}

/** 后台按顺序把全书补齐。每页渲染完让出主线程，翻页请求可随时插队 */
async function startBackgroundRender(){
  const epoch = RENDER.epoch;
  const total = state.pages.length;
  for (let i = 0; i < total; i++){
    const p = state.pages[i];
    if (!p || !p.pending || p._rendering) continue;
    await ensurePageRendered(i);
    if (epoch !== RENDER.epoch) return;   // 已经换书，别再动旧的页面
    // 让出主线程：给浏览器回收内存、响应用户操作的机会
    await new Promise((r) => setTimeout(r, 0));
  }
  if (epoch === RENDER.epoch){
    const failed = state.pages.filter((p) => p._failed).length;
    if (!failed) flash("全书 " + total + " 页已全部就绪");
  }
}

/* --- 把图片文件读成页面 --- */
async function loadImages(files, onProgress){
  const pages = [];
  const sorted = files.slice().sort((a, b) =>
    a.name.localeCompare(b.name, "zh-Hans-CN", { numeric: true, sensitivity: "base" })
  );
  for (let i = 0; i < sorted.length; i++){
    const f = sorted[i];
    onProgress(i + 1, sorted.length, "正在读取 " + f.name);
    const url = URL.createObjectURL(f);   // 直接引用原文件，零重编码
    const dim = await new Promise((res) => {
      const im = new Image();
      im.onload = () => res({ w: im.naturalWidth, h: im.naturalHeight });
      im.onerror = () => res({ w: 0, h: 0 });
      im.src = url;
    });
    pages.push({
      file: url,
      label: "第 " + (i + 1) + " 页",
      w: dim.w, h: dim.h,
      source: f.name,
    });
  }
  return pages;
}

/* --- 入口：接收一批文件 ---
   handles 可选：与 fileList 对应的 FileSystemFileHandle（走
   showOpenFilePicker 时才有）。有句柄就存进 IndexedDB，
   「最近打开」才能一键重开；拖放进来的文件拿不到句柄，照旧。 */
async function importFiles(fileList, handles){
  const files = Array.from(fileList || []);
  if (!files.length) return;

  const pdfs = files.filter((f) => /\.pdf$/i.test(f.name) || f.type === "application/pdf");
  const imgs = files.filter((f) => f.type.startsWith("image/") || /\.(jpe?g|png|bmp|tiff?|webp|gif|jfif)$/i.test(f.name));

  if (!pdfs.length && !imgs.length){
    alert("没有识别到可用的文件。\n请拖入 PDF 或 JPG / PNG / TIFF 等图片。");
    return;
  }

  $("empty").classList.remove("show");
  setProgress("准备中…", 0, "");

  try{
    let pages = [];
    let title = "未命名古籍";
    const newDocs = [];   // 本书涉及的 pdf.js 文档，开门后替换掉上一本的

    // 同一批里优先处理 PDF；若有多个 PDF，按文件名排序逐个追加
    const ordered = pdfs.slice().sort((a, b) =>
      a.name.localeCompare(b.name, "zh-Hans-CN", { numeric: true })
    );

    for (const pdf of ordered){
      // 解析是秒级的：只读结构 + 几何尺寸，不渲染像素
      const got = await loadPdf(pdf, (cur, tot, msg) => {
        setProgress("解析 PDF：" + pdf.name, cur / tot, msg);
      });
      newDocs.push(got.pdfDoc);
      pages = pages.concat(got);
      if (ordered.length === 1 && !imgs.length){
        title = pdf.name.replace(/\.pdf$/i, "");
      }
    }

    if (imgs.length){
      const got = await loadImages(imgs, (cur, tot, msg) => {
        setProgress("读取图片", cur / tot, msg);
      });
      pages = pages.concat(got);
      if (!ordered.length && imgs.length === 1){
        title = imgs[0].name.replace(/\.[^.]+$/, "");
      }
    }

    if (!pages.length) throw new Error("没有解析出任何页面");

    // 重新编号，保证 label 连续
    pages.forEach((p, i) => { p.label = "第 " + (i + 1) + " 页"; });

    // 用户是从「最近打开」点进来、重新选了同一个文件的情况：
    // 书名沿用记录里的，这样能续上同一条历史，而不是新增一条。
    const resume = pendingResume;
    pendingResume = null;
    const bookId = resume
      ? resume.id
      : "file:" + title + ":" + pages.length;

    // 有句柄就存下来：下次从「最近打开」点开，凭句柄直接重开，
    // 不再要求重新选文件。重新选同一个文件续读时也会覆盖到同一个 bookId。
    if (handles && handles.length){
      const pairs = [];
      for (const h of handles){
        if (h && h.name) pairs.push({ name: h.name, handle: h });
      }
      if (pairs.length) saveBookHandles(bookId, pairs);
    }

    // 文件本体也存一份缓存：拖放进来的书没有句柄，靠它实现一键重开。
    // Fire-and-forget：缓存写多慢都不该拖住开门。
    cacheBookFiles(bookId, files);

    // 续读目标页：先把"开门第一眼"的页面渲染好再展示，
    // 通常一两秒；其余页面开门后由后台队列补齐。
    const startIdx = resume ? Math.min(resume.page, pages.length) - 1 : 0;
    const firstPage = pages[startIdx];
    if (firstPage && firstPage.pending && firstPage._render){
      setProgress("正在渲染第 " + (startIdx + 1) + " 页", 0.92, "");
      try{
        const r = await firstPage._render();
        if (r){
          firstPage.file = r.url; firstPage.w = r.w; firstPage.h = r.h;
          firstPage.pending = false; firstPage._render = null;
        }else{
          firstPage.pending = false; firstPage._failed = true; firstPage._render = null;
        }
      }catch(e){
        console.warn("首页渲染失败：", e);
        firstPage.pending = false; firstPage._failed = true; firstPage._render = null;
      }
    }

    applyManifest({
      title: resume ? resume.name : title,
      direction: state.dir,   // 沿用当前装帧方向
      pageCount: pages.length,
      pages: pages,
    }, { bookId: bookId });

    // 新书已就位：销毁上一本的 pdf.js 文档，epoch++ 让旧后台循环退出
    disposeBookRenderers(newDocs);
    // 其余页面按顺序在后台慢慢补齐，翻页请求随时插队
    startBackgroundRender();

    // 记录下来。本机文件没法在下次凭空读回，只留书名 / 页数 / 进度做书签。
    rememberBook({
      id: bookId,
      name: state.title,
      kind: "file",
      total: pages.length,
      page: resume ? Math.min(resume.page, pages.length) : 1,
      dir: state.dir,
      theme: state.theme,
    });

    // 预取下一页（已渲染的才预取；未渲染的由后台队列负责）
    if (pages.length > 1 && !pages[1].pending) new Image().src = pageUrl(pages[1]);

    // 续读：跳回上次看到的那一页
    if (resume && resume.page > 1){
      const target = Math.min(resume.page, pages.length) - 1;
      requestAnimationFrame(() => goTo(target, false));
      flash("已回到第 " + (target + 1) + " 页");
    }

    hideProgress();
    flash("已载入 " + pages.length + " 页" +
      (pages.some((p) => p.pending) ? "，其余页面正在后台渲染" : ""));
  }catch(err){
    hideProgress();
    alert("载入失败：" + (err && err.message ? err.message : err));
    if (!state.ready) $("empty").classList.add("show");
  }
}

/* --- 文件选择 / 拖放 绑定 --- */
const fileInput = $("fileInput");

// 「打开文件」这条路上出过岔子的地方都记在这儿，方便排查（gushiReader.pickInfo()）
let lastPickError = null;
let pickerBlocked = false;   // 本会话里 picker 已经失败过，后面直接走 input

/**
 * showOpenFilePicker 并非到处可用，必须逐条判定：
 *   1. 旧浏览器 / 局域网 http 访问（非安全上下文）根本没有这个 API；
 *   2. 跨源 iframe（预览面板、被嵌进别的网页）里 Chrome 直接抛
 *      SecurityError: Cross origin sub frames aren't allowed to show a file picker；
 *   3. 页面被带 sandbox 的 iframe 包住时权限策略同样会拦。
 * 这些环境一律走 <input type="file">——否则点了按钮毫无反应，像是"坏了"。
 * 句柄只是顺带的好处（有文件本体缓存托底），丢掉不影响"最近打开"一键重开。
 */
function canUseFilePicker(){
  if (pickerBlocked) return false;
  if (typeof window.showOpenFilePicker !== "function") return false;
  if (window.isSecureContext === false) return false;
  try{
    // 任何 iframe 里都不用：input 稳得多，句柄非必需
    if (window.self !== window.top) return false;
  }catch(e){
    return false;   // 连 window.top 都读不到 = 跨源 iframe
  }
  return true;
}

/**
 * 打开文件。
 * 能用 File System Access API 就优先走 showOpenFilePicker：它给的不只是
 * File，还有可持久化的 FileSystemFileHandle —— 存进 IndexedDB 后，
 * 「最近打开」能凭句柄重读磁盘上的原文件（文件改过也能读最新的）。
 * 任何其它情况都退回 <input type="file">。
 */
async function pickFiles(){
  if (canUseFilePicker()){
    let handles = null;
    try{
      handles = await window.showOpenFilePicker({
        multiple: true,
        types: [{
          description: "PDF 或图片",
          accept: {
            "application/pdf": [".pdf"],
            "image/jpeg": [".jpg", ".jpeg", ".jfif"],
            "image/png": [".png"],
            "image/bmp": [".bmp"],
            "image/tiff": [".tif", ".tiff"],
            "image/webp": [".webp"],
            "image/gif": [".gif"],
          },
        }],
      });
    }catch(e){
      // 用户主动取消：静默退出，别多事
      if (e && e.name === "AbortError"){
        lastPickError = null;
        return;
      }
      // 其它失败（跨源 iframe / 权限策略 / 系统不支持…）：
      // 记下原因并永久降级到 input，别让按钮变成"点不动的死键"
      lastPickError = (e && e.name ? e.name + ": " : "") + (e && e.message ? e.message : String(e));
      pickerBlocked = true;
      handles = null;
    }

    if (handles && handles.length){
      const files = [];
      for (const h of handles){
        try{ files.push(await h.getFile()); }
        catch(e){ lastPickError = "getFile → " + (e && e.name ? e.name : e); }
      }
      if (files.length){ importFiles(files, handles); return; }
      // 一个文件都没读出来：同样降级，别在这里闷掉
      pickerBlocked = true;
    }
  }

  fileInput.value = "";
  fileInput.click();
}
$("btnOpen").addEventListener("click", pickFiles);
$("btnOpen2").addEventListener("click", pickFiles);
fileInput.addEventListener("change", () => importFiles(fileInput.files));

// 拖放：整窗口接收
// 判断依据优先看 types 是否含 "Files"；某些环境（含自动化测试）types 为空，
// 此时只要 dataTransfer 存在就认为是拖拽，避免漏判。
function isFileDrag(e){
  const dt = e.dataTransfer;
  if (!dt) return false;
  const types = dt.types ? Array.from(dt.types) : [];
  if (types.length === 0) return true;
  return types.includes("Files");
}

let dragDepth = 0;
const dz = $("dropzone");
window.addEventListener("dragenter", (e) => {
  if (!isFileDrag(e)) return;
  e.preventDefault();
  dragDepth++;
  dz.classList.add("on");
});
window.addEventListener("dragover", (e) => {
  if (!isFileDrag(e)) return;
  e.preventDefault();
  if (e.dataTransfer) e.dataTransfer.dropEffect = "copy";
});
window.addEventListener("dragleave", (e) => {
  dragDepth = Math.max(0, dragDepth - 1);
  if (dragDepth === 0) dz.classList.remove("on");
});
window.addEventListener("drop", (e) => {
  e.preventDefault();
  dragDepth = 0;
  dz.classList.remove("on");
  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length){
    importFiles(e.dataTransfer.files);
  }
});

// 键盘
window.addEventListener("keydown", (e) => {
  if (overlay.classList.contains("open")){
    if (e.key === "Escape"){ closeGo(); e.preventDefault(); }
    if (e.key === "Enter"){ doGo(); e.preventDefault(); }
    return;
  }
  if (e.target && e.target.tagName === "INPUT") return;

  // 面板打开时，Esc 优先关面板
  if (e.key === "Escape" && $("themePanel").classList.contains("open")){
    closeThemePanel(); e.preventDefault(); return;
  }
  if (e.key === "Escape" && $("histPanel").classList.contains("open")){
    closeHistPanel(); e.preventDefault(); return;
  }

  // 彩蛋：监听开发者签名序列
  trackEggKey(e.key);

  switch(e.key){
    // 左右方向键固定语义，与装帧方向无关：
    //   ← 上一页（页码变小）   → 下一页（页码变大）
    // 装帧方向只影响页面在屏幕上的滑动方向，不该影响按键含义。
    case "ArrowLeft": case "a": case "A":
      prev(); e.preventDefault(); break;
    case "ArrowRight": case "d": case "D":
      next(); e.preventDefault(); break;
    case " ": case "PageDown":
      next(); e.preventDefault(); break;
    case "Backspace": case "PageUp":
      prev(); e.preventDefault(); break;
    case "Home": goTo(0); e.preventDefault(); break;
    case "End": goTo(state.pages.length - 1); e.preventDefault(); break;
    case "+": case "=": zoomBy(1.25); e.preventDefault(); break;
    case "-": case "_": zoomBy(0.8); e.preventDefault(); break;
    case "0": resetFit(); e.preventDefault(); break;
    case "f": case "F": toggleFull(); e.preventDefault(); break;
    case "g": case "G": openGo(); e.preventDefault(); break;
    case "o": case "O": pickFiles(); e.preventDefault(); break;
    // 循环切换阅读底色
    case "t": case "T": cycleTheme(); e.preventDefault(); break;
    // 最近打开
    case "h": case "H": toggleHistPanel(); e.preventDefault(); break;
    // 聚焦：关 → 一页 → 两页 循环
    case "x": case "X": cycleFocusMode(); e.preventDefault(); break;
    // 翻书模式：对开显示 + 翻页动画
    case "b": case "B": toggleViewMode(); e.preventDefault(); break;
  }
});

// 鼠标滚轮翻页（未缩放时）。
// 未缩放：向下滚 = 下一页。
// 缩放后交还给容器的原生滚动 —— 容器已被镜像，滚轮方向自动符合右开本，
// 这里不要再插手，否则会跟原生滚动打架。
let wheelLock = 0;
stage.addEventListener("wheel", (e) => {
  if (isZoomed()) return;
  const now = Date.now();
  if (now - wheelLock < 420) return;
  const d = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
  if (Math.abs(d) < 6) return;
  wheelLock = now;
  d > 0 ? next() : prev();
}, { passive:true });

// 滚动时同步页码：用户拖动滚动条/滚轮滑动后，页码与滑块要跟上。
// 用 rAF 节流，避免高频 scroll 事件里反复查 DOM。
let scrollRaf = 0;
stage.addEventListener("scroll", () => {
  if (!isZoomed() || !state.ready) return;
  if (scrollRaf) return;
  scrollRaf = requestAnimationFrame(() => {
    scrollRaf = 0;
    const p = pageAtScroll();
    if (p !== state.idx){
      state.idx = p;
      updateChrome();
      markThumb();
    }
  });
}, { passive:true });

/* ------------------------------------------------------------------
   布局变了就重新归位（安全网）

   轨道宽度原来是靠 <img> 撑出来的。只要有一张图片晚到，整条轨道的宽度
   就会变，之前算好的滚动位置立刻失效。实测过的坏情况：
     图片未加载时 maxScroll = 0，图片到齐后 maxScroll = 2776，
   而 scrollLeft 还停在 0 —— 右开本的第 1 页在最右端，于是被整个挤出
   视野右侧，滑块停在半路，用户得自己去把滚动条拖到最右边才看得到第 1 页。

   render() / applyScale() 现在已按原始宽高比预留纸面宽度，正常情况下
   根本不会出现这种漂移；这里再兜一层：只要轨道宽度变了，就把当前页
   重新贴回它该在的位置。用户自己滚过之后就不再插手，尊重他找好的位置。
   ------------------------------------------------------------------ */
let lastTrackW = -1;
let userOwnsScroll = false;
function userTakesScroll(){ userOwnsScroll = true; }

const reflowGuard = new ResizeObserver(() => {
  if (!state.ready || drag.active) return;   // 正在手抓拖动时别跟用户抢位置
  const w = track.scrollWidth;
  if (w === lastTrackW) return;
  lastTrackW = w;

  if (isZoomed()){
    if (userOwnsScroll) return;              // 用户已经自己找好位置了
    const target = scrollLeftForPage(state.idx);
    if (Math.abs(target - stage.scrollLeft) < 2) return;
    stage.scrollLeft = target;               // 直接归位，不做动画
  } else {
    // 居中模式没有滚动条可对，重新把当前页摆正即可
    alignToCurrent(false);
  }
});
reflowGuard.observe(track);

// 滚轮 / 按住拖动都算"用户接管了滚动位置"
stage.addEventListener("wheel", userTakesScroll, { passive:true });
stage.addEventListener("pointerdown", userTakesScroll, { passive:true });

// 手抓拖动：鼠标 / 触屏 / 触控笔统一走 Pointer Events。
// 未缩放时它是"拖动翻页"，缩放后它是"拖动画布"。详见 drag 注释块。
stage.addEventListener("pointerdown", beginDrag);
stage.addEventListener("pointermove", moveDrag);
stage.addEventListener("pointerup", (e) => endDrag(e, false));
stage.addEventListener("pointercancel", (e) => endDrag(e, true));
// 触屏上还需阻止拖动时页面跟着滚，否则和我们的平移打架
stage.addEventListener("touchmove", (e) => {
  if (drag.active && drag.axis === "x") e.preventDefault();
}, { passive:false });

// 点击阅读区左右半屏：左半屏上一页，右半屏下一页（与按钮一致）
stage.addEventListener("click", (e) => {
  if (e.target.closest(".nav")) return;
  // 刚做完拖动的手势不要再当成点击，否则拖完会顺带翻一页
  if (drag.justDragged){ drag.justDragged = false; return; }
  if (isZoomed()) return;
  const r = stage.getBoundingClientRect();
  const x = e.clientX - r.left;
  if (x < r.width * 0.28) prev();
  else if (x > r.width * 0.72) next();
});

// 供自动化测试与外部脚本调用的极小接口。
// 只暴露跳页、状态快照和主题切换，不暴露内部实现细节。
window.goTo = goTo;
window.gushiReader = {
  state: () => ({
    idx: state.idx, total: state.pages.length,
    title: state.title,
    dir: state.dir, theme: state.theme, zoom: state.zoom,
    focus: state.focus,
    focusScope: state.focusScope,
    view: state.view,
    flipping: flipBusy,
    zoomed: isZoomed(),
    scrollLeft: Math.round(stage.scrollLeft),
    maxScroll: Math.round(maxScrollLeft()),
    bookId: state.bookId,
    history: readHistory().length,
    // PDF 懒渲染：还没渲染出图的页数（0 = 全书就绪）
    pendingPages: state.pages.filter((p) => p.pending).length,
    failedPages: state.pages.filter((p) => p._failed).length,
    // 拖动状态，供自动化断言"抓取中"的视觉反馈确实生效
    dragging: drag.active,
    dragAxis: drag.axis,
  }),
  setTheme: applyTheme,
  setFocus: setFocusMode,
  setFocusScope,
  setDirection,
  // 视图模式：setView("book") 进翻书、setView("scroll") 回连续轨道
  setView: setViewMode,
  // 翻书布局自检：当前「跨」的摆位（含左右两张纸各自的位置与页号），供自动化断言
  bookInfo: () => {
    if (!state.pages.length) return null;
    const area = $("bookArea");
    const W = area.clientWidth || stage.clientWidth || 1;
    const baseH = Math.max(200, stage.clientHeight - 84);
    const cs = crosses();
    const k = crossIndexAt(state.idx);
    const cross = cs[k];
    const plan = planCross(cross, W, baseH);
    const pick = (slot) => {
      const it = plan.items.filter((x) => x.slot === slot)[0];
      return it ? { idx: it.idx, left: it.left, w: it.w } : null;
    };
    return {
      index: state.idx, total: state.pages.length,
      cross: k, crossCount: cs.length, crossKind: cross.kind, crossPages: cross.pages.slice(),
      kind: cross.kind,
      left: pick("L"), right: pick("R"), full: pick("F"),
      // 兼容旧断言：整张跨报 full，落单页按它所在的半侧报
      half: pick("F") ? "full" : (pick("R") ? "right" : "left"),
      h: Math.round(plan.H),
      spineX: Math.round(W / 2), rtl: bookRTL(),
      pending: cross.pages.some((i) => state.pages[i].pending),
    };
  },
  // PDF 解析库自检：库从哪来的（本地 / CDN）、worker 指向哪儿
  pdfInfo: () => ({
    loaded: !!window.pdfjsLib,
    source: pdfjsSource,
    worker: window.pdfjsLib ? window.pdfjsLib.GlobalWorkerOptions.workerSrc : "",
    localFile: PDFJS_LOCAL,
  }),
  // 打开文件的通道自检：走的哪条路、有没有失败过、失败原因是什么
  pickInfo: () => ({
    mode: canUseFilePicker() ? "picker" : "input",
    blocked: pickerBlocked,
    hasApi: typeof window.showOpenFilePicker === "function",
    secure: window.isSecureContext === true,
    inIframe: (() => { try{ return window.self !== window.top; }catch(e){ return true; } })(),
    lastError: lastPickError,
  }),
  history: () => readHistory(),
  clearHistory,
  // 强制渲染某一页（0 基），供自动化测试与调试
  renderPage: (i) => ensurePageRendered(i),
  // 内部状态全亮出来：真机上出"页码在、内容无"这类静默故障时，
  // 让用户把 diag 结果发过来就能定位，不用猜
  diag: () => {
    let bookDisplay = "?", areaW = 0, areaH = 0;
    try{
      bookDisplay = getComputedStyle($("book")).display;
      const r = $("bookArea").getBoundingClientRect();
      areaW = Math.round(r.width); areaH = Math.round(r.height);
    }catch(e){}
    const leaves = ["bookL", "bookR", "bookFull"].map((id) => {
      const el = $(id);
      const im = el.querySelector("img");
      return { id, display: el.style.display,
               hasSrc: !!(im && im.getAttribute("src")),
               nw: im ? im.naturalWidth : -1 };
    });
    return {
      view: state.view,
      datasetView: document.body.dataset.view,
      ready: state.ready,
      pages: state.pages.length,
      bookDisplay, areaW, areaH, leaves,
      trackPages: track.children.length,
      pendingPages: state.pages.filter((p) => p.pending).length,
      failedPages: state.pages.filter((p) => p._failed).length,
      // 入口与存储：判断「记录变空了」到底是书的问题还是打开方式的问题
      env: {
        origin: ENV.origin, protocol: ENV.protocol, file: ENV.file,
        secure: ENV.secure, picker: ENV.picker,
        lsOK: ENV.lsOK, idbOK: ENV.idbOK,
        persisted: ENV.persisted, usageMB: ENV.usageMB, quotaMB: ENV.quotaMB,
      },
      errors: DIAG.errors.slice(),
      heals: DIAG.heals.slice(),
    };
  },
  // 环境自检结果（入口地址 / 存储可持久性）
  env: () => Object.assign({}, ENV),
};

/* ===================================================================
   自愈看门狗 + 错误可见化
   真机上出现过「页码在、内容全无」而本地各种环境都复现不了的静默
   故障（预览面板渲染进程异常、大部头扫描件内存吃紧、未知 JS 错误
   都会这样表现）。三道保险：
     1) 未捕获的错误 / Promise 拒绝弹一条右上角小浮层，不再无声吞掉；
     2) 每秒多体检一次：该显示却空着的视图就地修复（重摆 / 重建）；
     3) gushiReader.diag() 把内部状态和自愈记录亮出来，便于远程定位。
   =================================================================== */
const DIAG = { errors: [], heals: [] };

let errToastTimer = 0;
function showErrToast(msg){
  const el = $("errToast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(errToastTimer);
  errToastTimer = setTimeout(() => el.classList.remove("show"), 8000);
}
$("errToast").addEventListener("click", () => {
  clearTimeout(errToastTimer);
  $("errToast").classList.remove("show");
});

function recordErr(msg){
  const line = String(msg || "未知错误").slice(0, 160);
  DIAG.errors.push(line);
  if (DIAG.errors.length > 20) DIAG.errors.shift();
  showErrToast("内部错误（不影响翻页可继续阅读）：" + line);
}
window.addEventListener("error", (e) => recordErr(e.message));
window.addEventListener("unhandledrejection", (e) => {
  const r = e.reason;
  recordErr(r && (r.message || String(r)) || "未处理的 Promise 拒绝");
});

function heal(msg, detail){
  // detail 进诊断记录（供 gushiReader.diag() 取证），弹窗只显示人话
  DIAG.heals.push(detail ? msg + "【" + detail + "】" : msg);
  if (DIAG.heals.length > 20) DIAG.heals.shift();
  flash(msg);
}

// 翻书缺页要连续两轮体检都成立才动手：单次瞬态（渲染间隙、被节流的一帧）
// 不值得弹窗打扰；真空白 2.4 秒内也会被修好
let bookMissStreak = 0, bookMissWhy = "";

function watchdogTick(){
  if (!state.ready || !state.pages.length) return;
  // 导入 / 跳页的过程中先别插手
  if ($("loading").classList.contains("show")) return;
  const dv = document.body.dataset.view;
  if (dv !== state.view){
    // 状态与 DOM 属性漂移（扩展或外部脚本改过 DOM 之类）：拉回来
    document.body.dataset.view = state.view;
    heal("视图属性与状态不一致，已重置");
  }
  if (state.view === "book"){
    const area = $("bookArea");
    const r = area.getBoundingClientRect();
    // 当前跨该有的每张纸都要在位，且已渲染的页不能是空图
    const cross = crosses()[crossIndexAt(state.idx)];
    const plan = planCross(cross, Math.max(320, stage.clientWidth), Math.max(200, stage.clientHeight - 84));
    let why = "";
    const missing = plan.items.some((it) => {
      const el = $(it.slot === "F" ? "bookFull" : (it.slot === "L" ? "bookL" : "bookR"));
      if (el.style.display === "none" || el._leafIdx !== it.idx){
        why = "第 " + (it.idx + 1) + " 页没摆进槽位 " + it.slot;
        return true;
      }
      const p = state.pages[it.idx];
      if (p.pending || p._failed) return false;
      const im = el.querySelector("img");
      if (!(im && im.getAttribute("src"))){ why = "第 " + (it.idx + 1) + " 页的纸上没有图"; return true; }
      return false;
    });
    if ((r.width < 10 || r.height < 10 || missing) && !flipBusy){
      bookMissStreak++;
      bookMissWhy = (r.width < 10 || r.height < 10)
        ? "区域尺寸塌成 " + Math.round(r.width) + "x" + Math.round(r.height)
        : why + "（读到第 " + (state.idx + 1) + " 页，跨型 " + cross.kind + "）";
      if (bookMissStreak >= 2){
        bookMissStreak = 0;
        layoutBook();
        heal("翻书视图缺页，已自动重摆", bookMissWhy);
      }
    } else {
      bookMissStreak = 0;
    }
  } else if (!track.children.length && !$("empty").classList.contains("show")){
    render();
    alignToCurrent(false);
    heal("连续视图页面丢失，已自动重建");
  }
}
setInterval(() => { try{ watchdogTick(); }catch(e){ /* 看门狗自己不能成新故障源 */ } }, 1200);

/* ===================================================================
   环境自检：入口地址与存储可持久性
   ---------------------------------------------------------------
   反复出现「这次调好了，下次打开又不行」，根子不在阅读器，在**入口**：
   浏览器把每个地址当成不同的网站，各存一份数据 ——
     http://127.0.0.1:8899   ≠   http://localhost:8899   ≠   file:///…
   三种打开方式各有一套「最近打开」「阅读位置」「设置」，互不可见；
   更隐秘的是，整本书的离线缓存属 best-effort 存储，浏览器在磁盘吃紧
   或清理数据时会静默回收，表现就是「上次一键打开，这次又要重新导入」。
   这里做三件事：申请持久存储、入口不对时说清楚、信息挂进 diag()。
   =================================================================== */
const ENV = {
  origin: "", protocol: "", file: false, secure: false,
  lsOK: true, idbOK: true, picker: false,
  persisted: null, usageMB: 0, quotaMB: 0,
};
const ENV_DISMISS_KEY = "gushi-reader-envbar-dismissed";

function showEnvBar(html){
  const el = $("envBar");
  if (!el) return;
  el.innerHTML = html + '<span class="x" title="知道了，不再提示">×</span>';
  el.classList.add("show");
}
$("envBar").addEventListener("click", (e) => {
  if (!e.target.classList || !e.target.classList.contains("x")) return;
  $("envBar").classList.remove("show");
  try{ localStorage.setItem(ENV_DISMISS_KEY, "1"); }catch(err){}
});

/** 双击直开又读不到库清单时，把「该怎么做」直接写出来，不留空白页 */
function adviceForFileMode(){
  if (!ENV.file) return;
  showEnvBar("<b>没能读到书库清单</b>（file:// 下浏览器禁止网页读取本地文件）。" +
    "请双击书库文件夹里的 <b>启动右翻书.bat</b> 打开阅读器；" +
    "或直接把 PDF／图片拖进本页面，一样可以读。");
}

/** 根据自检结果给出一次性建议（用户点 × 后不再打扰） */
function envAdvise(){
  let dismissed = false;
  try{ dismissed = localStorage.getItem(ENV_DISMISS_KEY) === "1"; }catch(e){}
  if (dismissed) return;
  if (ENV.file){
    showEnvBar("<b>当前是「双击文件」打开的阅读器（file://）。</b>" +
      "功能都能用，但阅读记录与离线缓存存在这个地址下，" +
      "换成别的方式打开就看不到它们。想每次都稳稳当当：" +
      "关掉本页，双击书库文件夹里的 <b>启动右翻书.bat</b>，" +
      "它固定用 <b>http://127.0.0.1:8899</b> 打开。");
    return;
  }
  if (ENV.persisted === false && ENV.usageMB >= 8){
    // 只在「真的缓存了整本书」时才提醒：此时数据被回收的代价最大。
    // 注意：Chrome 是否批准持久存储由它自己决定（看站点活跃度），
    // 所以这里说明的是事实与后果，不是逐次必现的告警。
    showEnvBar("<b>浏览器尚未把本站数据登记为「不会被自动清理」</b>" +
      "（已缓存约 " + ENV.usageMB + "MB 书页）。磁盘吃紧或清理浏览数据时，" +
      "这些离线缓存可能被系统回收，表现是「最近打开」里的书要重新选一次文件。" +
      "想更稳妥：在浏览器「设置 → 网站设置」里为本站允许持久存储，" +
      "或关掉本提示（点右侧 ×），需要时重新导入一次即可。");
    return;
  }
  if (!ENV.lsOK || !ENV.idbOK){
    showEnvBar("<b>浏览器限制或不支持本地存储</b>，" +
      "「最近打开」与阅读进度无法保存（可能开了无痕模式）。" +
      "去掉无痕模式，或用 <b>启动右翻书.bat</b> 打开即可。");
  }
}

async function initEnv(){
  ENV.origin = location.origin === "null" ? "file://" : location.origin;
  ENV.protocol = location.protocol;
  ENV.file = location.protocol === "file:";
  ENV.secure = window.isSecureContext === true;
  ENV.picker = typeof window.showOpenFilePicker === "function";
  try{
    localStorage.setItem("gushi-ls-probe", "1");
    localStorage.removeItem("gushi-ls-probe");
    ENV.lsOK = true;
  }catch(e){ ENV.lsOK = false; }
  try{ ENV.idbOK = !!window.indexedDB; }catch(e){ ENV.idbOK = false; }

  // 主动申请「持久存储」：Chrome 下不弹窗，批准后本站数据不再被自动回收。
  // 整本 PDF 的离线缓存就存在这里，这一句能少掉一大批「最近打开失效」。
  try{
    if (navigator.storage && navigator.storage.persist){
      ENV.persisted = await navigator.storage.persisted();
      if (!ENV.persisted) ENV.persisted = await navigator.storage.persist();
    }
  }catch(e){ ENV.persisted = null; }
  try{
    if (navigator.storage && navigator.storage.estimate){
      const est = await navigator.storage.estimate();
      ENV.usageMB = Math.round((est.usage || 0) / 1048576);
      ENV.quotaMB = Math.round((est.quota || 0) / 1048576);
    }
  }catch(e){}
  try{ envAdvise(); }catch(e){}
}

// 启动
boot();
</script>
