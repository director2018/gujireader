<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="OZOqa2t3nUV7No1saldd1J">
<head data-page-node-id="GYEghnc26Lc0b5XD609iGv">
<meta charset="UTF-8" data-page-node-id="ARPSORj2kUfnue2XZnAPCT">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" data-page-node-id="4D9fRdBOluEEKuDghZAmSO">
<title>右翻书古籍阅读器</title>
<style>
  /* ============================================================
     阅读底色主题
     通过 body[data-theme] 切换。每种主题给出五个色值：
       底色(bg) / 面板(panel) / 描边(line) / 正文(ink) / 强调(accent)
     色值都按护眼方向调过：低饱和、低对比、避开纯白与纯黑。
     ============================================================ */
  :root{
    --radius:10px;
  }

  /* 1. 宣纸 —— 默认，暖白偏黄，最接近古籍用纸 */
  body[data-theme="paper"]{
    --bg:#ede8dd; --panel:#fbf9f4; --panel-2:#f4f1e8;
    --line:#d8d0c0; --line-soft:#e6e0d3;
    --ink:#2f2a22; --ink-soft:#6d6455; --ink-faint:#9a9081;
    --accent:#8a5a2b; --accent-soft:#f0e4d4;
    --paper:#fffdf8; --paper-line:#e3dccb; --paper-line-2:#d6cdba;
    --shadow:0 1px 2px rgba(60,48,32,.06), 0 8px 24px rgba(60,48,32,.10);
  }

  /* 2. 豆沙绿 —— 经典护眼色，降低蓝光刺激 */
  body[data-theme="green"]{
    --bg:#c7d9c2; --panel:#e4eede; --panel-2:#d8e7d2;
    --line:#a8bfa2; --line-soft:#bed2b8;
    --ink:#25301f; --ink-soft:#4f6047; --ink-faint:#7d8f75;
    --accent:#3f6b35; --accent-soft:#cfe3c8;
    --paper:#f4faf0; --paper-line:#c4d8be; --paper-line-2:#b3caac;
    --shadow:0 1px 2px rgba(40,60,35,.07), 0 8px 24px rgba(40,60,35,.12);
  }

  /* 3. 米黄 —— 柔和暖黄，适合长时间阅读 */
  body[data-theme="amber"]{
    --bg:#f2e6c9; --panel:#fdf7e8; --panel-2:#f8efd9;
    --line:#dcc9a0; --line-soft:#e8dabb;
    --ink:#3a2f1a; --ink-soft:#6f6041; --ink-faint:#9c8b68;
    --accent:#9a6d1f; --accent-soft:#f0dfb8;
    --paper:#fffcf2; --paper-line:#e6d6b4; --paper-line-2:#d9c69f;
    --shadow:0 1px 2px rgba(80,62,30,.07), 0 8px 24px rgba(80,62,30,.11);
  }

  /* 4. 青灰 —— 冷调低饱和，夜间或光线偏暖时更舒服 */
  body[data-theme="slate"]{
    --bg:#dde3e4; --panel:#f2f6f7; --panel-2:#e7eef0;
    --line:#c0ccce; --line-soft:#d3dee0;
    --ink:#242c2e; --ink-soft:#526063; --ink-faint:#849396;
    --accent:#3d6b74; --accent-soft:#d5e5e8;
    --paper:#f8fbfb; --paper-line:#cdd9db; --paper-line-2:#bcc9cb;
    --shadow:0 1px 2px rgba(35,50,55,.06), 0 8px 24px rgba(35,50,55,.10);
  }

  /* 5. 深褐 —— 暗色主题，纯黑改深褐，夜间不刺眼 */
  body[data-theme="sepia-dark"]{
    --bg:#2b2723; --panel:#37322d; --panel-2:#413a34;
    --line:#544b43; --line-soft:#463f38;
    --ink:#eae1d3; --ink-soft:#b5a898; --ink-faint:#8a7e70;
    --accent:#d0a86a; --accent-soft:#4a3f33;
    --paper:#f0e9dc; --paper-line:#5c534a; --paper-line-2:#4e463e;
    --shadow:0 1px 2px rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Songti SC","SimSun","Noto Serif CJK SC","Source Han Serif SC",
                "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    overflow:hidden;
    display:flex;flex-direction:column;
    /* 只过渡具体属性，不要写 background 简写：
       简写会让计算值在过渡期间被钉在起始色上（无头浏览器里甚至永远不推进），
       换底色时会看到旧颜色残留。background-color + color 才是正确做法。 */
    transition:background-color .22s ease,color .22s ease;
  }
  /* 主题切换时面板与描边也不要突变 */
  header,footer,#thumbs{transition:background-color .22s ease,border-color .22s ease}

  /* ---------------- 顶栏 ---------------- */
  header{
    flex:0 0 auto;
    display:flex;align-items:center;gap:12px;
    padding:8px 14px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
    z-index:30;
    min-height:48px;
  }
  .brand{display:flex;align-items:baseline;gap:9px;min-width:0}
  .brand .seal{
    width:24px;height:24px;flex:0 0 auto;border-radius:4px;
    background:var(--accent);color:#fff;
    display:grid;place-items:center;
    font-size:13px;font-weight:700;letter-spacing:0;
    font-family:"Songti SC","SimSun",serif;
    box-shadow:0 1px 2px rgba(138,90,43,.35);
  }
  #bookTitle{
    font-size:15px;font-weight:600;letter-spacing:.04em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:32vw;
  }
  #bookMeta{font-size:11.5px;color:var(--ink-faint);white-space:nowrap}
  .spacer{flex:1 1 auto}

  .btn{
    appearance:none;border:1px solid var(--line);
    background:var(--panel-2);color:var(--ink);
    font:inherit;font-size:12.5px;
    padding:5px 11px;border-radius:7px;
    cursor:pointer;white-space:nowrap;
    transition:background .13s,border-color .13s,color .13s;
    line-height:1.5;
  }
  .btn:hover{background:var(--accent-soft);border-color:#d9c4a6}
  .btn:active{transform:translateY(.5px)}
  .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
  .btn.ghost{background:transparent}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.primary:hover{background:#7a4f26;border-color:#7a4f26}
  .group{display:flex;gap:0;border-radius:7px;overflow:hidden}
  .group .btn{border-radius:0;border-right-width:0}
  .group .btn:first-child{border-radius:7px 0 0 7px}
  .group .btn:last-child{border-radius:0 7px 7px 0;border-right-width:1px}

  /* ---------------- 阅读区 ---------------- */
  main{
    flex:1 1 auto;position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }

  /* 从右向左的推进轨道：页面横向排列，整体平移 */
  #track{
    display:flex;
    height:100%;
    align-items:center;
    gap:28px;
    padding:22px 0;
    will-change:transform;
    transition:transform .38s cubic-bezier(.22,.61,.36,1);
    transform:translate3d(0,0,0);
  }
  #track.instant{transition:none}

  .page{
    flex:0 0 auto;
    height:100%;
    display:flex;align-items:center;justify-content:center;
  }
  .page .sheet{
    position:relative;
    height:100%;
    /* 宽度由 JS 按页面原始宽高比预留（见 render / applyScale）。
       这一点很关键：如果让 <img> 自己撑宽度，图片没下载完时宽度接近 0，
       整条轨道的宽度、最大滚动量都会算小，滚动条位置随之算错。 */
    background:var(--paper, #fffdf8);
    box-shadow:var(--shadow);
    border:1px solid var(--paper-line, #e3dccb);
    /* 书页右缘的装订侧阴影，暗示这是右开本 */
    border-right:1px solid var(--paper-line-2, #d6cdba);
    overflow:hidden;
  }
  .page img{
    display:block;
    height:100%;width:100%;
    /* 预留比例与图片比例一致时正好铺满；万一不一致也只留白、不拉伸 */
    object-fit:contain;
  }
  /* PDF 懒渲染占位：架子已按真实宽高比摆好，中间转圈提示"正在渲染" */
  .sheet.pending::after,
  .sheet.failed::after{
    content:"";
    position:absolute;left:50%;top:50%;
    width:26px;height:26px;margin:-13px 0 0 -13px;
    border:3px solid var(--line-soft);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:pagespin .9s linear infinite;
  }
  .sheet.pending::before,
  .sheet.failed::before{
    position:absolute;left:0;right:0;top:calc(50% + 26px);
    text-align:center;font-size:12px;
    color:var(--ink-faint, var(--line));
    z-index:1;
  }
  .sheet.pending::before{ content:"正在渲染…"; }
  .sheet.failed::before{ content:"本页渲染失败"; }
  .sheet.failed::after{ display:none; }
  @keyframes pagespin{ to{ transform:rotate(360deg); } }

  .page .pnum{
    position:absolute;left:50%;transform:translateX(-50%);bottom:-19px;
    font-size:11px;color:var(--ink-faint);white-space:nowrap;
    letter-spacing:.06em;
  }

  /* ------------------------------------------------------------------
     翻书模式（body[data-view="book"] 时生效）

     一屏摊开一「跨」（cross），像一本摊在桌上的书；任何一页都是完整原页。
       - 对开扫描（宽高比 >= 1.15，一页里印着左右两面书）整张居中独占一屏；
       - 单页扫描两两配跨：右开本先读页在右、次读页在左（左开本反之），
         两侧都有纸，书脊落在正中。
     翻页是一张纸绕书脊转 180° 的 3D 动画，分层从下到上：
       #bookL / #bookR / #bookFull  静态层：左半张 / 右半张 / 整张对开
       #bookGutter   书脊阴影（JS 按页面形态摆位置）
       #bookFlipWrap 翻动层：搬运中的那张纸，正面是它原来那面、背面是翻过去后
                     该看到的那一页
     ------------------------------------------------------------------ */
  #book{
    position:absolute;inset:0;z-index:10;
    display:none;align-items:center;justify-content:center;
    perspective:2400px;
    background:
      radial-gradient(130% 100% at 50% 38%, rgba(255,246,224,.07), rgba(0,0,0,.32)),
      linear-gradient(180deg, #4a3d2f, #2b241d);
  }
  body[data-view="book"] #book{ display:flex; }
  body[data-view="book"] #track{ visibility:hidden; }

  #bookArea{ position:relative; }

  /* 一张摊开的纸。宽高与位置全部由 JS 计算（含对开/单页两种摆法） */
  .leaf{
    position:absolute;top:0;z-index:1;
    background:var(--paper, #fffdf8);
    box-shadow:0 8px 26px rgba(0,0,0,.5);
    overflow:hidden;
  }
  /* contain：容器尺寸本来就是按原页比例算的，正常填满；
     万一尺寸信息缺失也不会把书页拉变形，只会留一点纸边 */
  .leaf img{ display:block;width:100%;height:100%;object-fit:contain; }
  .leaf.pend::after{
    content:"";position:absolute;left:50%;top:50%;
    width:26px;height:26px;margin:-13px 0 0 -13px;
    border:3px solid rgba(0,0,0,.14);
    border-top-color:var(--accent, #8a5a2b);
    border-radius:50%;
    animation:pagespin .9s linear infinite;
  }
  /* 翻书叶子的"本页渲染失败"：连续模式的 .sheet.failed 有提示，
     翻书模式以前只留一张白纸，用户看不出是坏了还是没加载 —— 补齐 */
  .leaf.pend-fail::after{
    content:"本页渲染失败";position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%);
    font-size:13px;letter-spacing:.08em;
    color:var(--ink-faint, #9a9081);
    border:1px solid var(--paper-line, #e3dccb);
    background:var(--paper, #fffdf8);
    padding:8px 16px;border-radius:8px;
  }
  /* 内部错误浮层：真机上出现过本地无法复现的静默故障，
     任何未捕获异常都亮在这里，不再无声吞掉 */
  #errToast{
    position:fixed;top:12px;right:12px;z-index:200;
    max-width:min(540px,80vw);
    background:#7a2e2e;color:#fff;
    font-size:12px;line-height:1.6;
    padding:9px 14px;border-radius:10px;
    box-shadow:0 6px 22px rgba(0,0,0,.28);
    display:none;white-space:pre-wrap;word-break:break-all;
    cursor:pointer;user-select:none;
  }
  #errToast.show{ display:block; }

  /* 入口提示条：双击文件打开、或浏览器不肯把本站数据设为「可持久」时，
     把「换个地址打开就等于换了个网站」这件事当面说清，
     而不是等用户发现「最近打开」变空了再纳闷。 */
  #envBar{
    position:fixed;left:50%;top:10px;transform:translateX(-50%);
    z-index:190;max-width:min(780px,92vw);
    background:var(--paper, #fffdf8);color:var(--ink, #2b2118);
    border:1px solid rgba(138,90,43,.5);
    box-shadow:0 6px 22px rgba(0,0,0,.2);
    font-size:12.5px;line-height:1.7;
    padding:9px 14px;border-radius:10px;
    display:none;
  }
  #envBar.show{ display:block; }
  #envBar b{ color:var(--accent, #8a5a2b); }
  #envBar .x{
    float:right;margin-left:12px;cursor:pointer;
    opacity:.55;user-select:none;font-size:15px;line-height:1.2;
  }
  #envBar .x:hover{ opacity:1; }

  /* 书脊阴影：JS 决定横向位置与方向，这里只负责画 */
  #bookGutter{
    position:absolute;top:-8px;bottom:-8px;z-index:4;
    pointer-events:none;
  }
  #bookGutter.g-spread{
    background:linear-gradient(90deg,
      rgba(0,0,0,0) 0%, rgba(0,0,0,.2) 40%, rgba(0,0,0,.32) 50%,
      rgba(0,0,0,.2) 60%, rgba(0,0,0,0) 100%);
  }
  #bookGutter.g-in{
    background:linear-gradient(90deg, rgba(0,0,0,.26), rgba(0,0,0,0));
  }
  #bookGutter.g-out{
    background:linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,.26));
  }

  /* 翻动层：正脸是纸的推进侧半张，背脸是纸背 */
  #bookFlipWrap{
    position:absolute;top:0;z-index:8;
    pointer-events:none;
    transform-style:preserve-3d;
  }
  #bookFlipWrap .flip{
    position:absolute;inset:0;
    transform-style:preserve-3d;
    will-change:transform;
  }
  #bookFlipWrap.anim .flip{
    transition:transform .58s cubic-bezier(.32,.08,.34,1);
  }
  .flip .face{
    position:absolute;inset:0;overflow:hidden;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
  }
  .flip .face.front{
    background:var(--paper, #fffdf8);
    box-shadow:0 12px 34px rgba(0,0,0,.55);
  }
  .flip .face.front img{ position:absolute;top:0;height:100%; }
  .flip .face.back{
    transform:rotateY(180deg);
    background:linear-gradient(90deg, #efe4cc, #e2d4b6);
    box-shadow:inset 0 0 40px rgba(0,0,0,.14);
  }
  /* 纸背就是翻过去后该看到的那一面书页（古籍扫描件里的下一页） */
  .flip .face.back img{
    position:absolute;top:0;height:100%;
    box-shadow:inset 0 0 30px rgba(0,0,0,.1);
  }

  /* 翻书模式的页码：压在桌面下缘，浅色字 */
  #bookNum{
    position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
    font-size:12px;letter-spacing:.08em;
    color:rgba(255,248,235,.72);white-space:nowrap;
  }
  body:not([data-view="book"]) #bookNum{ display:none; }

  /* ------------------------------------------------------------------
     聚焦模式（可选，body[data-focus="1"] 时生效）

     聚焦范围内（.focus-cur，一页或当前跨的两页）保持原样，
     两侧页面轻微虚化 + 变淡，眼睛自然落在正在读的范围上。
     虚化只加在 .sheet 上，页码标签 .pnum 在 sheet 外面，保持清晰可读。

     filter 过渡要常驻在 .sheet 上（而不是只在聚焦模式下写）：
     翻页瞬间"旧当前页变虚、新当前页变清"才有平滑的交叉过渡，
     否则会在一帧内硬切，看起来像闪了一下。
     ------------------------------------------------------------------ */
  .page .sheet{
    transition:filter .3s ease, opacity .3s ease;
  }
  body[data-focus="1"] .page:not(.focus-cur) .sheet{
    filter:blur(4px) saturate(.85);
    opacity:.6;
  }

  /* ------------------------------------------------------------------
     缩放模式下的滚动方向

     古籍右开本的内容自右向左读，滚动条也应该跟着这个方向：
     滑块从右端起步，往左拖才是「往后读」。

     这里不用 CSS 花招，走最稳的一条路 —— 保持布局和原生滚动完全正常，
     只把「滚动条位置」与「内容位置」的对应关系反过来：

       - 容器保持普通 overflow，内容照常从左到右排布（首格是末页，见 laneSlots）
       - 用 JS 把 stage.scrollLeft 放到最大：滑块停在最右端
       - 用户往左拖滑块 ⇒ scrollLeft 减小 ⇒ 视野往左移 ⇒ 看到更靠后的页
       - 滚轮 / 触控板 / 空格键同样处理，方向自动一致

     试过但不可行的两条路，记在这里免得以后重走：
       - transform:scaleX(-1) 镜像整个轨道：能翻转视觉，但会把
         scrollWidth 的计算搞乱（实测 scrollWidth 塌陷），且子元素要逐个镜像回来。
       - direction:rtl 加在滚动容器上：实测 scrollWidth - clientWidth 直接变成 0，
         内容不再溢出，等于把滚动功能弄没了。
     两条路都会破坏原生滚动的可靠性，所以最终选择 JS 映射。
     ------------------------------------------------------------------ */
  main.zoomed{overflow-x:auto;overflow-y:hidden;align-items:flex-start;justify-content:flex-start}
  main.zoomed #track{
    height:auto;min-height:100%;padding:22px 22px 22px 22px;
    /* 缩放模式下由滚动条负责定位，JS 不要再平移轨道 */
    transform:none !important;
    transition:none;
  }
  /* 缩放模式下左右两侧的翻页按钮会挡住内容，收起（滚动本身就能翻页） */
  main.zoomed .nav{opacity:0;pointer-events:none}

  /* ---------------- 左右翻页按钮 ---------------- */
  .nav{
    position:absolute;top:50%;transform:translateY(-50%);
    width:52px;height:96px;
    display:grid;place-items:center;
    /* 用 color-mix 跟随主题，深色主题下不会突兀变白 */
    background:color-mix(in srgb, var(--panel) 86%, transparent);
    backdrop-filter:blur(6px);
    border:1px solid var(--line);
    color:var(--ink-soft);
    cursor:pointer;z-index:20;
    transition:background .15s,color .15s,border-color .15s,opacity .2s;
    user-select:none;
  }
  .nav:hover{background:var(--accent-soft);color:var(--accent);border-color:#d9c4a6}
  .nav:disabled{opacity:.26;cursor:default;background:color-mix(in srgb, var(--panel) 50%, transparent);color:var(--ink-faint);border-color:var(--line-soft)}
  .nav svg{width:22px;height:22px;display:block}
  .nav .cap{
    position:absolute;bottom:7px;font-size:10px;letter-spacing:.1em;
    font-family:inherit;
  }
  #btnPrev{left:18px;border-radius:0 12px 12px 0;border-left:none}
  #btnNext{right:18px;border-radius:12px 0 0 12px;border-right:none}

  /* ---------------- 底栏 ---------------- */
  footer{
    flex:0 0 auto;
    background:var(--panel);
    border-top:1px solid var(--line);
    padding:7px 14px 9px;
    z-index:30;
  }
  .row{display:flex;align-items:center;gap:12px}
  .row + .row{margin-top:7px}

  input[type=range]{
    -webkit-appearance:none;appearance:none;
    flex:1 1 auto;height:22px;background:transparent;cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:3px;background:var(--line);border-radius:2px;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:14px;height:14px;border-radius:50%;
    background:var(--accent);border:2px solid var(--panel);

<script>
"use strict";

/* =======================================================================
   右翻书古籍阅读器

   页序约定：state.pages 永远按「第 1 页在前」的自然顺序存放。
   左右摆位由 laneSlots() 依据装帧方向计算，不改变数组本身顺序。
   详见下方「方向模型」注释。
   ======================================================================= */

const DATA_URL = "data/manifest.json";

const state = {
  pages: [],          // 页面数组，下标 0 就是第 1 页
  dir: "right-to-left",   // 装帧方向：right-to-left(古籍右开) / left-to-right(现代左开)
  idx: 0,             // 当前页码（0 基，0 = 第 1 页）—— 驱动所有 UI
  fitHeight: 0,       // 适应窗口时的页面高度(px)
  zoom: 1,            // 相对适应高度的缩放倍率
  title: "右翻书古籍阅读器",
  ready: false,
  userPickedDir: false,  // 用户是否手动切过装帧方向
  // 阅读底色主题
  theme: "paper",
  // 聚焦模式：开启后当前读的范围清晰、两侧虚化
  focus: false,
  // 聚焦范围："1" 只聚焦当前一页；"2" 聚焦当前跨（对开的两页）
  focusScope: "1",
  // 视图模式：scroll(连续滚动轨道) / book(翻书：对开 + 翻页动画)
  view: "scroll",
  // 当前这本书的历史记录 id（用于「最近打开」高亮与书签回写）
  bookId: "",
};

/* ---------- DOM ---------- */
const $ = (id) => document.getElementById(id);
const stage = $("stage"), track = $("track");
const btnPrev = $("btnPrev"), btnNext = $("btnNext");
const slider = $("slider"), pageLabel = $("pageLabel"), zoomLabel = $("zoomLabel");
const dirRTL = $("dirRTL"), dirLTR = $("dirLTR"), dirHint = $("dirHint");
const thumbs = $("thumbs"), thumbStrip = $("thumbStrip");
const overlay = $("overlay"), goInput = $("goInput");

/** 用户点了「本机文件」类的历史记录后，等待他重新选择的那本书 */
let pendingResume = null;

/* ---------- 工具 ---------- */
function flash(msg){
  const el = $("flash");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(flash._t);
  flash._t = setTimeout(() => el.classList.remove("show"), 1000);
}

/* ===================================================================
   彩蛋：任意界面连续键入 "liweiyuan"

   印章式全屏签名 + 控制台落款，用于标记作者身份。
   所用字母 l/i/w/e/y/u/a/n 均未绑定任何功能快捷键，
   触发彩蛋不会误触翻页、聚焦等操作。
   =================================================================== */
const DEV_SEQ = "liweiyuan";
let eggBuf = "";
let eggBusy = false;

function showDevEgg(){

  const title = document.createElement("div");
  title.textContent = "右翻书古籍阅读器";
  title.style.cssText =

    "text-indent:12px;color:#e8dcc0;";

  // 印章：盖章动画（从大缩小落下，微微回弹）
  const seal = document.createElement("div");
  seal.textContent = "liweiyuan";

    "font:700 22px/1 Consolas,monospace;color:#c0392b;" +
    "border:3px solid #c0392b;border-radius:8px;padding:12px 22px;" +
    "letter-spacing:4px;transform:rotate(-4deg) scale(3);opacity:0;" +

  const sub = document.createElement("div");

  requestAnimationFrame(() => {

    setTimeout(() => {

      seal.style.opacity = "1";

  });

  // 控制台同步落款
  try {
    console.log(
      "%c右翻书古籍阅读器 %c Developed by liweiyuan ",
      "font:bold 16px sans-serif;color:#c0392b;",
      "background:#c0392b;color:#fff;font:bold 12px Consolas,monospace;padding:2px 6px;border-radius:3px;"
    );
  } catch(e){}

function trackEggKey(key){
  if (/^[a-z]$/i.test(key)){
    eggBuf = (eggBuf + key.toLowerCase()).slice(-DEV_SEQ.length);
    if (eggBuf === DEV_SEQ){ eggBuf = ""; showDevEgg(); }
  } else if (key.length !== 1){
    // 修饰键（Shift 等）不打断序列
    return;
  } else {
    eggBuf = "";
  }
}

function loadImage(src){
  return new Promise((res) => {
    const im = new Image();
    im.onload = () => res({ ok:true, w:im.naturalWidth, h:im.naturalHeight });
    im.onerror = () => res({ ok:false, w:0, h:0 });
    im.src = src;
  });
}

/* ---------- 尺寸计算 ---------- */
function computeFitHeight(){
  // 页面按高度铺满阅读区，宽度自然溢出 —— 单页阅读时观感最接近实体书
  const h = stage.clientHeight - 44;
  state.fitHeight = Math.max(200, h);
}

/** 是否处于"放大后可滚动"模式 */
function isZoomed(){
  return state.zoom > 1.01;
}

/* ===================================================================
   手抓拖动

   一个手势，两种含义，按当前模式分流：

     未缩放 —— 拖动当"翻页手势"用：
       按下并横向拖过阈值就翻一页，跟触屏滑动的手感一致。
       这里松开时才判定，中途只做跟手的视觉反馈。

     已缩放 —— 拖动当"平移画布"用：
       内容比窗口大，按住直接拖比去够滚动条方便得多。
       滚动方向要跟着装帧方向走：
         右开本：手指向右拖 ⇒ 看更靠后的页（手指拖着纸往右走，后面的页从左边进来）
         左开本：手指向左拖 ⇒ 看更靠后的页
       换成 scrollLeft 的话，两种方向都是「手指往哪拖，scrollLeft 就往反方向减」，
       所以统一写成 scrollLeft -= dx 即可，无需按方向分支。

   用 Pointer Events 而不是分别监听 mouse/touch：
   一套代码同时覆盖鼠标、触屏、触控笔，且能用 setPointerCapture
   保证鼠标拖出窗口再松开也能正确收尾（否则会卡在"抓取中"状态）。
   =================================================================== */

const drag = {
  active: false,
  id: null,          // pointerId
  startX: 0, startY: 0,
  lastX: 0,
  startScroll: 0,
  moved: false,      // 是否已超过判定阈值
  panned: false,     // 本次是否真的平移过
  axis: "",          // "x" | "y" | ""  首次移动时锁定主方向
  justDragged: false,// 上一次手势是拖动；用于忽略紧随其后的 click
};

/** 拖动判定阈值：低于它视为点击，不触发拖动逻辑 */
const DRAG_MIN = 6;
/** 未缩放时，拖多远算翻一页 */
const SWIPE_MIN = 42;

function dragThreshold(){
  return isZoomed() ? DRAG_MIN : SWIPE_MIN;
}

function beginDrag(e){
  if (!state.ready) return;
  if (e.button !== undefined && e.button !== 0) return;      // 只响应左键
  if (e.target.closest(".nav, header, footer, #thumbs, #themePanel, #histPanel, #overlay")) return;

  // 立刻中断上一次松手触发的平滑吸附动画。
  // 否则新拖动会和还在进行的 scrollTo({behavior:"smooth"}) 抢滚动位置：
  // 动画会把 scrollLeft 往回拉，用户看到的就是"拖了半天几乎没动"。
  stage.scrollTo({ left: stage.scrollLeft, behavior: "auto" });

  drag.active = true;
  drag.id = e.pointerId;
  drag.startX = drag.lastX = e.clientX;
  drag.startY = e.clientY;
  drag.startScroll = stage.scrollLeft;
  drag.moved = false;
  drag.panned = false;
  drag.axis = "";

  // 捕获指针：鼠标拖出窗口再松开也能收到 pointerup
  try { stage.setPointerCapture(e.pointerId); } catch(err){}
}

function moveDrag(e){
  if (!drag.active || e.pointerId !== drag.id) return;

  const dx = e.clientX - drag.startX;
  const dy = e.clientY - drag.startY;

  // 首次移动锁定主轴：横向手势才当拖动，纵向留给原生滚动
  if (!drag.axis){
    if (Math.abs(dx) < DRAG_MIN && Math.abs(dy) < DRAG_MIN) return;
    drag.axis = Math.abs(dx) >= Math.abs(dy) ? "x" : "y";
    if (drag.axis === "y" && !isZoomed()){
      // 未缩放时纵向手势没有意义，直接放弃这次拖动
      endDrag(e, true);
      return;
    }
  }
  if (drag.axis !== "x") return;

  drag.moved = true;

  if (isZoomed()){
    // 平移画布：手指往右拖，内容跟着往右走
    const nextScroll = drag.startScroll - dx;
    const max = maxScrollLeft();
    const clamped = Math.max(0, Math.min(max, nextScroll));
    stage.scrollLeft = clamped;
    drag.panned = true;
    stage.classList.add("grabbing", "dragging");
  } else {
    // 未缩放：给一点跟手的位移反馈，松手才决定是否翻页
    const pull = Math.max(-90, Math.min(90, dx)) * 0.42;
    track.classList.add("instant");
    track.style.transform = "translate3d(" + (targetX() + pull) + "px,0,0)";
    stage.classList.add("grabbing", "dragging");
  }
}

function endDrag(e, cancel){
  if (!drag.active) return;
  if (e && e.pointerId !== undefined && e.pointerId !== drag.id) return;

  const wasMoved = drag.moved;
  const wasPanned = drag.panned;
  const dx = (e ? e.clientX : drag.lastX) - drag.startX;
  const dy = (e ? e.clientY : drag.startY) - drag.startY;

  drag.active = false;
  drag.id = null;
  drag.moved = false;
  drag.panned = false;
  drag.axis = "";
  // 记下"这次手势是拖动"，供紧随其后的 click 事件判断并忽略。
  // 不能只看 drag.moved —— 上面刚把它清掉了，而 click 是之后才派发的。
  if (wasMoved) drag.justDragged = true;

  try { stage.releasePointerCapture(e.pointerId); } catch(err){}
  stage.classList.remove("grabbing", "dragging");

  if (cancel) return;

  if (isZoomed()){
    // 平移结束：页码跟着滚动位置更新，并把当前页吸附到视野内
    if (wasPanned){
      const p = pageAtScroll();
      if (p !== state.idx){ state.idx = p; updateChrome(); markThumb(); }
      snapToCurrentPage();
    }
    return;
  }

  // 未缩放：松手后归位，再决定是否翻页
  track.classList.remove("instant");
  alignToCurrent(!wasMoved ? false : true);

  if (!wasMoved) return;
  if (Math.abs(dx) < SWIPE_MIN || Math.abs(dx) < Math.abs(dy) * 1.2) return;

  // 统一语义：往左拖 = 下一页，往右拖 = 上一页（与触屏滑动、按钮一致）
  if (dx < 0) next(); else prev();
}

/**
 * 一页「露出得够多」的判定阈值。
 *
 * 注意分母必须是**页面自己的宽度**，不是视野宽度。
 * 用视野宽度会出错：缩放后一页往往只占视野的 40%~50%
 * （实测 668px 的页放在 1416px 的视野里 = 47%），
 * 这时"露出过半视野"永远不成立，判定就会全盘失效。
 */
function mostlyVisibleRatio(){ return 0.6; }

/** 这一页在视野里露出的宽度占自身宽度的比例 */
function visibleRatioOf(el){
  const sr = stage.getBoundingClientRect();
  const b = el.getBoundingClientRect();
  const w = b.width || 1;
  const visible = Math.min(b.right, sr.right) - Math.max(b.left, sr.left);
  return Math.max(0, Math.min(1, visible / w));
}

/**
 * 平移结束后决定要不要吸附。
 *
 * 拖动是「自由浏览」，不能每松一次手就把页面拽回居中 ——
 * 那样用户刚拖过去看右边一截，一松手就被拉回来，手感非常别扭。
 *
 * 只在一种情况下吸附：**视野里没有任何一页露出超过自身宽度的 60%**，
 * 说明停在了两页之间那种"两页都只看得到一小半"的尴尬位置。
 * 其余情况（包括贴左端、贴右端）一律保持用户拖到的位置。
 */
function snapToCurrentPage(){
  if (!isZoomed()) return;

  const thr = mostlyVisibleRatio();
  let anyMostlyVisible = false;
  track.querySelectorAll(".page").forEach((el) => {
    if (visibleRatioOf(el) >= thr) anyMostlyVisible = true;
  });

  if (anyMostlyVisible) return;   // 用户看得好好的，别动

  const target = scrollLeftForPage(state.idx);
  if (Math.abs(target - stage.scrollLeft) < 4) return;
  stage.scrollTo({ left: target, behavior: "smooth" });
}

/** 最大可滚动距离 */
function maxScrollLeft(){
  return Math.max(0, stage.scrollWidth - stage.clientWidth);
}

/**
 * 把当前语义页码换算成它应该占据的 scrollLeft（仅缩放模式）。
 *
 * 右开本的滚动条从右向左：语义页码越大，内容越靠左，scrollLeft 越小。
 * 所以这里不做额外的方向反转 —— laneSlots() 已经把第 1 页放在最右格，
 * 内容天然就是从右向左推进的，scrollLeft 只要老实反映几何位置即可。
 *
 * 两端要做边界对齐，而不是简单地把页面居中：
 *   - 第 1 页（右开本的起点）应当贴着右端，即 scrollLeft = max
 *   - 末页应当贴着左端，即 scrollLeft = 0
 * 否则「起点」会是 max - 半个视野，与 resetScrollStart() 设定的起点对不上，
 * 用户一松手就会被吸附走一段距离，看着像是"拖了却没动"。
 */
function scrollLeftForPage(srcIdx){
  const total = state.pages.length;
  const el = pageEl(srcIdx);
  if (!el || !total) return 0;

  const max = maxScrollLeft();

  // 第 1 页永远是"阅读起点"，只是贴的边随装帧方向不同：
  //   右开本 —— 第 1 页在最右格，贴右端（scrollLeft = max）
  //   左开本 —— 第 1 页在最左格，贴左端（scrollLeft = 0）
  // 末页不用特别处理：它天然落在另一端，下面的居中公式夹一下就是对的。
  if (srcIdx === 0) return state.dir === "right-to-left" ? max : 0;

  // 让这一页水平居中；再夹到合法范围
  const center = el.offsetLeft + el.offsetWidth / 2;
  const target = center - stage.clientWidth / 2;
  return Math.max(0, Math.min(max, target));
}

/** 指定语义页码对应的 DOM 元素 */
function pageEl(srcIdx){
  const total = state.pages.length;
  if (!total) return null;
  const slot = slotOfPage(state.dir, total)[srcIdx];
  return track.children[slot] || null;
}

/**
 * 进入缩放模式时把滚动条移到「起点」。
 * 右开本起点在最右端（scrollLeft = max），左开本起点在最左端（0）。
 * 这是让用户一眼看出滚动方向的唯一办法。
 */
function resetScrollStart(){
  stage.scrollLeft = state.dir === "right-to-left" ? maxScrollLeft() : 0;
}

/** 把当前页滚到视野内（仅缩放模式） */
function scrollCurrentIntoView(smooth){
  if (!isZoomed()) return;
  const target = scrollLeftForPage(state.idx);
  stage.scrollTo({ left: target, behavior: smooth ? "smooth" : "auto" });
}

/**
 * 当前滚动位置对应的语义页码（仅缩放模式）。
 *
 * 判定依据不能只看"谁露出的面积最大"。缩放后视野里往往同时有 2~3 页，
 * 面积最大者常常不是读者心里的那一页 —— 例如停在最右端（右开本的起点）时，
 * 第 1 页只露出后半部分，而第 2 页完整可见，按面积算会把当前页判成第 2 页，
 * 于是后续吸附又会把视野从"贴右端"挪到"第 2 页居中"，看起来就是拖了没反应。
 *
 * 改用「阅读顺序上的领先原则」：
 *   右开本读的时候视线从左往右移，所以视野里最靠左的那页是已经读完的、
 *   最靠右的边缘才是"接下来要读"的位置。
 *
 * 具体做法：取「在视野里露出的宽度超过可见宽度一半」的页面中最靠后的那一页
 * （右开本取 srcIdx 最大者，左开本取最小者）。露出过半才算数，
 * 避免刚蹭到一角的页被误判成当前页。
 */
function pageAtScroll(){
  if (!isZoomed()) return state.idx;
  const rtl = state.dir === "right-to-left";
  const thr = mostlyVisibleRatio();

  // 贴着"阅读起点"那一端时，当前页就是第 1 页。
  // 窗口够宽时一屏常常同时容下第 1、2 页，若一律取"语义页码更靠后的那一页"，
  // 刚放大到滚动模式、或刚从别处回到开头，页码会显示成第 2 页 ——
  // 与"这本书刚翻开、正看着第一页"的事实对不上。
  const startEdge = rtl ? maxScrollLeft() : 0;
  if (Math.abs(stage.scrollLeft - startEdge) <= 4) return 0;

  let best = null;
  track.querySelectorAll(".page").forEach((el) => {
    if (visibleRatioOf(el) < thr) return;   // 露出太少，不算"在看这一页"
    const idx = Number(el.dataset.src);
    if (best === null) { best = idx; return; }
    // 右开本：取语义页码更大者（更靠后）；左开本反之
    if (rtl ? idx > best : idx < best) best = idx;
  });

  // 一页都没露出足够多（例如正停在两页之间）：退回面积最大者，保证总有结果
  if (best === null){
    const sr = stage.getBoundingClientRect();
    let bestArea = -1;
    track.querySelectorAll(".page").forEach((el) => {
      const b = el.getBoundingClientRect();
      const w = Math.min(b.right, sr.right) - Math.max(b.left, sr.left);
      const h = Math.min(b.bottom, sr.bottom) - Math.max(b.top, sr.top);
      const area = Math.max(0, w) * Math.max(0, h);
      if (area > bestArea){ bestArea = area; best = Number(el.dataset.src); }
    });
  }
  return best === null ? state.idx : best;
}

function applyScale(){
  const ph = Math.round(state.fitHeight * state.zoom);
  track.querySelectorAll(".page .sheet").forEach((sheet) => {
    sheet.style.height = ph + "px";
    // 高度变了，按预留的宽高比重算宽度，否则轨道宽度会不对
    const ar = Number(sheet.dataset.ar || 0);
    if (ar > 0) sheet.style.width = Math.round(ph * ar) + "px";
  });
  zoomLabel.textContent = Math.round(state.zoom * 100) + "%";

  const wasZoomed = stage.classList.contains("zoomed");
  const zoomed = isZoomed();
  stage.classList.toggle("zoomed", zoomed);

  // 缩放是我们主动改的，位置也归我们管 —— 解开"用户已接管"，
  // 这样缩放引起的高度/宽度变化若是引起轨道尺寸变动，会自动贴回当前页。
  userOwnsScroll = false;

  // 进入滚动模式时提示该往哪个方向拖，避免用户以为滚动条坏了
  const zh = $("zoomHint");
  if (zoomed){
    zh.textContent = state.dir === "right-to-left" ? "滚动条从右向左拖" : "滚动条从左向右拖";
  } else {
    zh.textContent = "";
  }

  if (!state.ready) return;

  if (zoomed){
    if (!wasZoomed){
      // 刚从「居中模式」进入滚动模式。
      //
      // 两个目标要同时满足，且顺序不能反：
      //   1. 用户仍停在原来那一页（不能因为放大就跳回第 1 页）
      //   2. 若本来就在第 1 页，则滚动条要停在「方向起点」那一端，
      //      这样用户一眼能看出该往哪边拖
      //
      // 第 1 页恰好位于起点那一端（右开本在最右、左开本在最左），
      // 所以「停在第 1 页」和「停在起点」本来就重合，不冲突。
      // 但若当前不在第 1 页，就只做第 1 件事，别把人家拉回开头。
      const atFirst = state.idx === 0;
      requestAnimationFrame(() => {
        if (atFirst) resetScrollStart();
        else scrollCurrentIntoView(false);
      });
    } else {
      // 已经在滚动模式里继续放大/缩小：保持当前页在视野内
      scrollCurrentIntoView(false);
    }
  } else {
    stage.scrollLeft = 0;
    alignToCurrent(false);
  }
}

/* ===================================================================
   方向模型（重新梳理，务必先读懂再改）

   全书有两种装帧方向，区别只在「第 1 页摆在最左还是最右」：

     右开本（古籍，默认）  第1页 ... 第N页   ← 从右往左读
                          ^最右端是第1页

     左开本（现代）        第1页 ... 第N页   → 从左往右读
                          ^最左端是第1页

   实现上分两层，不要混：

   ┌ srcIdx ────────────────────────────────────────────────┐
   │ 页面在「第几页」的语义序号，从 0 开始。                  │
   │ 0 = 第 1 页，n-1 = 末页。这是唯一驱动 UI 的真相。        │
   └────────────────────────────────────────────────────────┘
                          ↓ 由 laneSlots() 映射
   ┌ domSlot ───────────────────────────────────────────────┐
   │ 页面在 DOM 轨道里从左到右占用的格子号，只影响摆放位置。   │
   │ 右开本：第1页占最右的格子；左开本：占最左的格子。         │
   └────────────────────────────────────────────────────────┘

   关键约定：
   - 下一页 = srcIdx + 1（语义上的"往后读"），两种方向都一样
   - 页面在屏幕上的滑动方向由装帧方向决定：
       右开本：内容整体向左滑（读者视线从右往左移）
       左开本：内容整体向右滑
   - 左侧按钮永远是「上一页」，右侧按钮永远是「下一页」，与装帧方向无关。
     这符合所有人的直觉，不要为了"古籍感"把按钮也反过来。
   =================================================================== */

/**
 * 生成 domSlot -> srcIdx 的映射数组。
 * 数组下标是 DOM 格子号（从左到右），值是该格子放第几页（srcIdx）。
 *
 * 右开本：末页在最左一格，第 1 页在最右一格 -> [n-1, n-2, ..., 0]
 * 左开本：第 1 页在最左一格 -> [0, 1, ..., n-1]
 */
function laneSlots(dir, n){
  return dir === "right-to-left"
    ? Array.from({length:n}, (_, slot) => n - 1 - slot)
    : Array.from({length:n}, (_, slot) => slot);
}

/** srcIdx -> domSlot 的反查表 */
function slotOfPage(dir, n){
  const lane = laneSlots(dir, n);
  const map = new Array(n);
  lane.forEach((srcIdx, slot) => { map[srcIdx] = slot; });
  return map;
}

/* ===================================================================
   阅读底色主题
   五种护眼配色。选择结果记在 localStorage，下次打开自动沿用。
   =================================================================== */

const THEMES = [
  { id:"paper",      name:"宣纸",   dot:"#ede8dd", hint:"暖白偏黄，最接近古籍用纸" },
  { id:"green",      name:"豆沙绿", dot:"#c7d9c2", hint:"经典护眼色，降低蓝光刺激" },
  { id:"amber",      name:"米黄",   dot:"#f2e6c9", hint:"柔和暖黄，适合长时间阅读" },
  { id:"slate",      name:"青灰",   dot:"#dde3e4", hint:"冷调低饱和，光线偏暖时舒服" },
  { id:"sepia-dark", name:"深褐",   dot:"#2b2723", hint:"暗色主题，夜间不刺眼" },
];

const THEME_KEY = "gushi-reader-theme";

/**
 * 切换阅读底色。
 *
 * 注意：切换的瞬间要先把 body 上的过渡关掉，改完再恢复。
 * body 上有 background-color 的过渡，若带着过渡改 CSS 变量，
 * 浏览器会把计算出的背景色在过渡期间"钉"在起始色上，
 * 于是变量已经变了、画面却还是旧颜色（无头/后台标签页里尤其明显，
 * 甚至可能一直停在旧色上不推进）。关掉过渡后再切换，颜色立即生效，
 * 之后再恢复过渡，不影响其它属性变更的平滑度。
 */
function applyTheme(id){
  const theme = THEMES.find((t) => t.id === id) || THEMES[0];
  state.theme = theme.id;

  const prev = document.body.style.transition;
  document.body.style.transition = "none";
  document.body.setAttribute("data-theme", theme.id);
  // 读一次布局，确保上面这次变更被立即结算，再恢复过渡
  void document.body.offsetHeight;
  document.body.style.transition = prev;

  // 同步选中态
  $("themeList").querySelectorAll(".tp-item").forEach((el) => {
    el.classList.toggle("cur", el.dataset.theme === theme.id);
  });

  try { localStorage.setItem(THEME_KEY, theme.id); } catch(e){}
}

function buildThemeList(){
  const list = $("themeList");
  list.innerHTML = "";
  THEMES.forEach((t) => {
    const d = document.createElement("div");
    d.className = "tp-item";
    d.dataset.theme = t.id;
    d.title = t.hint;
    const dot = document.createElement("span");
    dot.className = "tp-dot";
    dot.style.background = t.dot;
    const nm = document.createElement("span");
    nm.className = "tp-name";
    nm.textContent = t.name;
    const ht = document.createElement("span");
    ht.className = "tp-hint";
    ht.textContent = t.hint;
    d.appendChild(dot);
    d.appendChild(nm);
    d.appendChild(ht);
    d.addEventListener("click", () => {
      applyTheme(t.id);
      closeThemePanel();
      flash("底色：" + t.name);
    });
    list.appendChild(d);
  });
}

function openThemePanel(){
  $("themePanel").classList.add("open");
}
function closeThemePanel(){
  $("themePanel").classList.remove("open");
}
function toggleThemePanel(){
  $("themePanel").classList.toggle("open");
}

/** 按顺序切到下一个主题（快捷键 T） */
function cycleTheme(){
  const i = THEMES.findIndex((t) => t.id === state.theme);
  const next = THEMES[(i + 1) % THEMES.length];
  applyTheme(next.id);
  flash("底色：" + next.name);
}

/* ===================================================================
   聚焦（可选，范围可选：一页 / 两页）

   开启后：聚焦范围内的页保持清晰，两侧页面轻微虚化 + 变淡。
   视觉焦点自然落在正在读的范围上，翻页时清晰页跟着走。

   范围两种：
     - "1" 一页：只有当前页（state.idx）清晰；
     - "2" 两页：当前跨（crosses）里的页都清晰 —— 对开扫描是整张，
       配对单页是左右两张，与翻书模式一屏摊开的范围一致，
       看跨页表格 / 批注对照时不会有一条边被虚化。

   实现要点：
     - CSS 挂在 body[data-focus="1"] 上，页元素只负责标记 .focus-cur；
     - 页码标签 .pnum 在 .sheet 外面，两侧页的页码保持可读；
     - 每次翻页后要重新标记，否则虚化会停留在上一页上。
       所有翻页路径（goTo / 缩放滚动同步 / 滑块）都会汇到
       updateChrome()，在那里重新标记即可全覆盖。
   =================================================================== */

const FOCUS_KEY = "gushi-reader-focus";
const FOCUS_SCOPE_KEY = "gushi-reader-focus-scope";

/** 当前聚焦范围内应保持清晰的页（语义页码字符串集合） */
function focusPageSet(){
  if (!state.pages.length) return [];
  if (state.focusScope === "2"){
    const cs = crosses();
    return cs[crossIndexAt(state.idx)].pages.map(String);
  }
  return [String(state.idx)];
}

function markFocusPage(){
  const set = new Set(focusPageSet());
  track.querySelectorAll(".page").forEach((el) => {
    el.classList.toggle("focus-cur", state.focus && set.has(el.dataset.src));
  });
}

/** 两个聚焦按钮的高亮态：当前生效范围亮、另一个灭 */
function applyFocusButtons(){
  $("btnFocus").setAttribute("aria-pressed",
    String(state.focus && state.focusScope === "1"));
  $("btnFocus2").setAttribute("aria-pressed",
    String(state.focus && state.focusScope === "2"));
}

/** 聚焦范围变化后统一收尾：改 body 属性、按钮、重标记 */
function applyFocusState(){
  document.body.setAttribute("data-focus", state.focus ? "1" : "0");
  applyFocusButtons();
  markFocusPage();
}

/**
 * 开关聚焦模式（保持当前范围不变）。
 * 与底色一样记在 localStorage，下次打开自动沿用。
 */
function setFocusMode(on){
  state.focus = !!on;
  applyFocusState();
  // 开启瞬间就把聚焦范围摆到正中（用户此前可能自由滚动过）
  if (state.focus && state.pages.length && !bookMode() && !isZoomed() && track.children.length){
    alignToCurrent(false);
  }
  try { localStorage.setItem(FOCUS_KEY, state.focus ? "1" : "0"); } catch(e){}
}

/** 设定聚焦范围；若聚焦未开则顺手打开 */
function setFocusScope(scope){
  const s = scope === "2" ? "2" : "1";
  const changed = state.focusScope !== s;
  state.focusScope = s;
  if (!state.focus) setFocusMode(true);
  else {
    applyFocusState();
    // 档位变了，聚焦范围中心也变了，立即重新居中
    if (changed && state.pages.length && !bookMode() && !isZoomed() && track.children.length){
      alignToCurrent(false);
    }
  }
  try { localStorage.setItem(FOCUS_SCOPE_KEY, s); } catch(e){}
  return changed;
}

function focusFlash(){
  if (!state.focus) flash("聚焦模式：关");
  else flash(state.focusScope === "2" ? "聚焦模式：两页" : "聚焦模式：一页");
}

/** 点「聚焦1页」：已在该档位则关闭，否则切到一页聚焦 */
function clickFocus1(){
  if (state.focus && state.focusScope === "1") setFocusMode(false);
  else setFocusScope("1");
  focusFlash();
}

/** 点「聚焦2页」：已在该档位则关闭，否则切到两页聚焦 */
function clickFocus2(){
  if (state.focus && state.focusScope === "2") setFocusMode(false);
  else setFocusScope("2");
  focusFlash();
}

/** X 键循环：关 → 一页 → 两页 → 关 */
function cycleFocusMode(){
  if (!state.focus) setFocusScope("1");
  else if (state.focusScope === "1") setFocusScope("2");
  else setFocusMode(false);
  focusFlash();
}

/* ===================================================================
   最近打开历史

   一个绕不开的现实：浏览器的沙箱机制下，网页无法凭一份记录重新读回
   本机文件（File 对象只在用户当次选择时有效）。所以这里分两种情况：

     1) 磁盘模式（data/manifest.json）—— 这类书籍的页面是相对路径，
        记录里只需存 manifest 地址，下次点一下就能重新载入，完全无缝。

     2) 拖进来的本机文件 —— 存不了文件本身（几十 MB 也塞不进
        localStorage）。这类记录只保留书名、页数、上次读到的页码，
        点击时提示用户重新选择该文件；选回来自动跳到上次的位置。

   记录按「最近打开」倒序，最多保留 MAX_HISTORY 条。
   =================================================================== */

const HIST_KEY = "gushi-reader-history";
const MAX_HISTORY = 12;

/** 读记录（容错：内容损坏时当作空列表，不让它把整个阅读器带崩） */
function readHistory(){
  try{
    const raw = localStorage.getItem(HIST_KEY);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr.filter((it) => it && it.id) : [];
  }catch(e){ return []; }
}

function writeHistory(list){
  try { localStorage.setItem(HIST_KEY, JSON.stringify(list)); }catch(e){}
}

/**
 * 写入 / 更新一条记录。
 *
 * kind: "local"  磁盘模式，可凭 manifest 直接重开
 *       "file"   本机文件，只能记住书签，重开需用户重新选文件
 */
function rememberBook(entry){
  const list = readHistory();
  const i = list.findIndex((it) => it.id === entry.id);
  const prev = i >= 0 ? list[i] : null;
  const item = {
    id: entry.id,
    name: entry.name || "未命名",
    kind: entry.kind || "local",
    // 磁盘模式的书靠这个地址重开；以前这里的字段白名单把 src 丢了，
    // 导致「最近打开」里的磁盘书点开被当成本机文件、误弹"请重新选择文件"。
    src: entry.src || (prev && prev.src) || "",
    total: entry.total || (prev && prev.total) || 0,
    page: entry.page || 1,
    dir: entry.dir || (prev && prev.dir) || "right-to-left",
    theme: entry.theme || (prev && prev.theme) || "paper",
    at: Date.now(),
  };
  if (i >= 0) list.splice(i, 1);
  list.unshift(item);
  writeHistory(list.slice(0, MAX_HISTORY));
  pruneOrphanCaches();   // 被挤出列表的旧书，句柄和文件缓存跟着清
  buildHistoryList();
}

/** 更新「当前这本书读到哪里」——切页时调用 */
function touchCurrentBook(){
  if (!state.ready || !state.bookId) return;
  const list = readHistory();
  const it = list.find((x) => x.id === state.bookId);
  if (!it) return;
  it.page = state.idx + 1;
  it.total = state.pages.length;
  it.dir = state.dir;
  it.theme = state.theme;
  it.at = Date.now();
  writeHistory(list);
}

function forgetBook(id){
  writeHistory(readHistory().filter((it) => it.id !== id));
  deleteBookHandles(id);        // 记录删了，配套的文件句柄也一起清
  deleteBookFiles(id);          // 文件缓存同理，别让它占着磁盘配额
  buildHistoryList();
}

function clearHistory(){
  writeHistory([]);
  clearAllBookHandles();
  clearAllBookFiles();
  buildHistoryList();
  flash("最近记录已清空");
}

/* ===================================================================
   文件句柄持久化（IndexedDB）

   浏览器沙箱不允许网页凭空重读本机文件 —— 但 File System Access API
   是个例外：通过 showOpenFilePicker 拿到的 FileSystemFileHandle 可以
   存进 IndexedDB，下次直接 getFile() 读回同一份文件，只需（最多一次）
   授权确认，不用再翻目录选文件。

   这里存的是 bookId -> [{ name, handle }, ...]。任何一步失败都静默
   退回"重新选择文件"的老流程，句柄只是锦上添花，绝不能把主流程带崩。
   =================================================================== */

const HANDLES_DB_NAME = "gushi-reader-handles";
const HANDLES_STORE = "books";

function idbOpenHandles(){
  return new Promise((resolve, reject) => {
    let req;
    try{ req = indexedDB.open(HANDLES_DB_NAME, 1); }
    catch(e){ reject(e); return; }   // 无痕模式等场景 indexedDB 可能被禁
    req.onupgradeneeded = () => {
      if (!req.result.objectStoreNames.contains(HANDLES_STORE))
        req.result.createObjectStore(HANDLES_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

/** 保存一本书的文件句柄（pairs: [{ name, handle }, ...]） */
async function saveBookHandles(bookId, pairs){
  if (!bookId || !pairs || !pairs.length) return;
  try{
    const db = await idbOpenHandles();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(HANDLES_STORE, "readwrite");
      tx.objectStore(HANDLES_STORE).put(pairs, bookId);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
    db.close();
  }catch(e){ /* 存不进就算了，历史记录里退回重选流程 */ }
}

/** 读一本书的文件句柄，没有 / 读不到都返回 null */
async function loadBookHandles(bookId){
  try{
    const db = await idbOpenHandles();
    const v = await new Promise((resolve, reject) => {
      const tx = db.transaction(HANDLES_STORE, "readonly");
      const rq = tx.objectStore(HANDLES_STORE).get(bookId);
      rq.onsuccess = () => resolve(rq.result || null);
      rq.onerror = () => reject(rq.error);
    });
    db.close();
    return v;
  }catch(e){ return null; }
}

async function deleteBookHandles(bookId){
  try{
    const db = await idbOpenHandles();
    await new Promise((resolve) => {
      const tx = db.transaction(HANDLES_STORE, "readwrite");
      tx.objectStore(HANDLES_STORE).delete(bookId);
      tx.oncomplete = resolve;
      tx.onerror = resolve;
    });
    db.close();
  }catch(e){}
}

async function clearAllBookHandles(){
  try{

    await new Promise((resolve) => {
      const tx = db.transaction(HANDLES_STORE, "readwrite");
      tx.objectStore(HANDLES_STORE).clear();
      tx.oncomplete = resolve;
      tx.onerror = resolve;
    });

}

/* ===================================================================
   文件本体缓存（IndexedDB 存 File 对象）

   句柄方案有个先天缺口：拖放进来的文件，浏览器不给句柄。
   但 File 对象本身是 Blob 的子类，可以直接放进 IndexedDB！
   所以拖进来的书也能「一键重开」——重开时从缓存取回 File 原样
   重新走一遍导入流程，画质路径完全不变（PDF 仍按 300 DPI 重新渲染）。

   与句柄的分工：
     - 句柄：读磁盘上的"当前"文件（文件更新后能看到新版本），但要授权；
     - 缓存：文件的"快照"（之后改了原文件看不到），但零授权、通吃拖放。
   重开时先试句柄，不行再试缓存，都不行才要求重选。

   单本书总大小超过 BOOK_CACHE_LIMIT 就不缓存（IndexedDB 也有配额，
   但与其写一半失败，不如明确跳过）；任何失败都静默降级到重选流程。
   =================================================================== */

const FILES_DB_NAME = "gushi-reader-bookfiles";
const FILES_STORE = "books";
const BOOK_CACHE_LIMIT = 1024 * 1024 * 1024;   // 1GB

function idbOpenFiles(){
  return new Promise((resolve, reject) => {
    let req;
    try{ req = indexedDB.open(FILES_DB_NAME, 1); }
    catch(e){ reject(e); return; }
    req.onupgradeneeded = () => {
      if (!req.result.objectStoreNames.contains(FILES_STORE))
        req.result.createObjectStore(FILES_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

/** 把导入的文件本体存为这本书的缓存（files: File 数组） */
async function cacheBookFiles(bookId, files){
  if (!bookId || !files || !files.length) return;
  let total = 0;
  for (const f of files) total += (f && f.size) || 0;
  if (total > BOOK_CACHE_LIMIT) return;   // 超限不缓存，重开时走重选
  try{
    const db = await idbOpenFiles();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(FILES_STORE, "readwrite");
      tx.objectStore(FILES_STORE).put({
        files: files.map((f) => ({ name: f.name, type: f.type, blob: f })),
      }, bookId);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
    db.close();
  }catch(e){ /* 配额不足等场景：不缓存，重开时退回重选流程 */ }
}

/** 读一本书的文件缓存，没有 / 读不到都返回 null */
async function loadBookFiles(bookId){
  try{
    const db = await idbOpenFiles();
    const v = await new Promise((resolve, reject) => {
      const tx = db.transaction(FILES_STORE, "readonly");
      const rq = tx.objectStore(FILES_STORE).get(bookId);
      rq.onsuccess = () => resolve(rq.result || null);
      rq.onerror = () => reject(rq.error);
    });
    db.close();
    return v;
  }catch(e){ return null; }
}

async function deleteBookFiles(bookId){
  try{
    const db = await idbOpenFiles();
    await new Promise((resolve) => {
      const tx = db.transaction(FILES_STORE, "readwrite");
      tx.objectStore(FILES_STORE).delete(bookId);
      tx.oncomplete = resolve;
      tx.onerror = resolve;
    });
    db.close();
  }catch(e){}
}

async function clearAllBookFiles(){
  try{
    const db = await idbOpenFiles();
    await new Promise((resolve) => {
      const tx = db.transaction(FILES_STORE, "readwrite");
      tx.objectStore(FILES_STORE).clear();
      tx.oncomplete = resolve;
      tx.onerror = resolve;

/** 这本书是否可一键重开（有句柄或有文件缓存），历史列表文案用 */
async function bookReopenable(bookId){
  try{
    const [h, f] = await Promise.all([loadBookHandles(bookId), loadBookFiles(bookId)]);
    return !!(h && h.length) || !!(f && f.files && f.files.length);
  }catch(e){ return false; }
}

/**
 * 清理已不在历史记录里的孤儿缓存。
 * 「最近打开」只保留 12 条，被挤出列表的书的句柄与文件缓存要跟着删，
 * 否则几百 MB 的 PDF 会一直占着用户的磁盘配额。
 */
async function pruneOrphanCaches(){
  let alive = [];
  try{ alive = readHistory().map((it) => it.id); }catch(e){ return; }
  const sweep = async (openDb, storeName) => {
    try{
      const db = await openDb();
      const keys = await new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, "readonly");
        const rq = tx.objectStore(storeName).getAllKeys();
        rq.onsuccess = () => resolve(rq.result || []);
        rq.onerror = () => reject(rq.error);
      });
      await Promise.all(keys.map((k) => new Promise((done) => {
        if (alive.includes(k)){ done(); return; }
        const tx = db.transaction(storeName, "readwrite");
        const rq = tx.objectStore(storeName).delete(k);
        rq.onsuccess = () => done();
        rq.onerror = () => done();
      })));
      db.close();
    }catch(e){}
  };
  await sweep(idbOpenHandles, HANDLES_STORE);
  await sweep(idbOpenFiles, FILES_STORE);
}

/** 相对时间：刚刚 / N 分钟前 / N 小时前 / N 天前 */
function relTime(ts){
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 60) return "刚刚";
  if (s < 3600) return Math.floor(s / 60) + " 分钟前";
  if (s < 86400) return Math.floor(s / 3600) + " 小时前";
  if (s < 86400 * 30) return Math.floor(s / 86400) + " 天前";
  const d = new Date(ts);
  return (d.getMonth() + 1) + " 月 " + d.getDate() + " 日";
}

function buildHistoryList(){
  const list = $("histList");
  if (!list) return;
  const items = readHistory();
  list.innerHTML = "";

  if (!items.length){
    const e = document.createElement("div");
    e.className = "hp-empty";
    e.textContent = "还没有记录。打开一本书后，这里会记住它。";
    list.appendChild(e);
    return;
  }

  items.forEach((it) => {
    const row = document.createElement("div");
    row.className = "hp-item";
    row.dataset.histId = it.id;
    if (it.id === state.bookId) row.classList.add("cur");
    row.title = it.kind === "file"
      ? "本机文件：「" + it.name + "」"
      : "点一下重新打开";

    const main = document.createElement("div");
    main.className = "hp-main";
    const nm = document.createElement("div");
    nm.className = "hp-name";
    nm.textContent = it.name;
    const sub = document.createElement("div");
    sub.className = "hp-sub";
    sub.textContent = relTime(it.at) + " · 共 " + it.total + " 页"
      + (it.kind === "file" ? " · " : "");
    main.appendChild(nm);
    main.appendChild(sub);

    // 本机文件：查一下有没有句柄或文件缓存，有就提示可以一键重开。
    // 查询是异步的，先按"需重选"渲染，结果回来后再原地更新文案。
    if (it.kind === "file"){
      bookReopenable(it.id).then((yes) => {
        if (yes){
          row.title = "本机文件：「" + it.name + "」—— 点一下直接打开（可能需要授权一次）";
          sub.textContent = relTime(it.at) + " · 共 " + it.total + " 页 · 可一键重开";
        }else{
          sub.textContent = relTime(it.at) + " · 共 " + it.total + " 页 · 需重新选择文件";
        }
      }).catch(() => {});
    }

    const pg = document.createElement("span");
    pg.className = "hp-page";
    pg.textContent = it.page + "/" + it.total;

    const del = document.createElement("button");
    del.className = "hp-del";
    del.type = "button";
    del.textContent = "×";
    del.title = "从记录中移除";
    del.addEventListener("click", (e) => {
      e.stopPropagation();
      forgetBook(it.id);
    });

    row.appendChild(main);
    row.appendChild(pg);
    row.appendChild(del);
    row.addEventListener("click", () => openHistoryItem(it, row));
    list.appendChild(row);
  });
}

/** 打开一条历史记录 */
async function openHistoryItem(it, row){
  closeHistPanel();

  // 磁盘模式：重新载入 manifest 即可。老记录可能没存 src（字段白名单丢过），
  // 这种就退回内置数据地址，别误当成"本机文件"去要求重选。
  if (it.kind === "local"){
    const src = it.src || DATA_URL;
    try{
      $("loading").classList.add("show");
      const res = await fetch(src + "?t=" + Date.now(), { cache:"no-store" });
      if (!res.ok) throw new Error("找不到数据文件");
      const mf = await res.json();
      applyManifest(mf);
      state.bookId = it.id;
      if (it.dir) setDirection(it.dir);
      if (it.page > 1) {
        requestAnimationFrame(() => goTo(it.page - 1, false));
      }
      return;
    }catch(err){
      alert("重新打开失败：" + (err && err.message ? err.message : err));
      $("loading").classList.remove("show");
      return;
    }
  }

  // 本机文件：优先凭保存的文件句柄直接重开（File System Access API）。
  // 句柄是当初通过「打开文件」按钮选文件时存下的（见 pickFiles / importFiles）。
  // 权限还在就直接读；丢了权限就借这次点击的用户激活请求一次授权；
  // 没存过句柄（拖放进来的书）、授权被拒、文件被移动/改名 —— 才退回
  // "重新选择文件"的老流程。
  pendingResume = it;
  let hadHandles = false;   // 是否存过句柄（兜底提示要按这个分支解释原因）
  try{
    const saved = await loadBookHandles(it.id);
    hadHandles = !!(saved && saved.length);
    if (hadHandles){
      const files = [];
      let ok = true;
      let stale = false;
      for (const rec of saved){
        const h = rec && rec.handle;
        if (!h){ ok = false; break; }
        try{
          let perm = "granted";
          if (h.queryPermission) perm = await h.queryPermission({ mode:"read" });
          if (perm !== "granted" && h.requestPermission)
            perm = await h.requestPermission({ mode:"read" });
          if (perm !== "granted"){ ok = false; break; }
          files.push(await h.getFile());
        }catch(e){
          // 句柄指向的文件已被移动 / 改名 / 删除
          ok = false; stale = true; break;
        }
      }
      if (ok && files.length){
        await importFiles(files);   // importFiles 自己管理进度层
        return;
      }
      if (stale){
        pendingResume = it;
        $("empty").classList.add("show");
        const box = $("empty").querySelector(".box");
        if (box){
          box.querySelector("h2").textContent = "找不到原来的文件";
          box.querySelector("p").innerHTML =
            "记录「<b>" + escapeHtml(it.name) + "</b>」指向的文件似乎被移动、"
            + "改名或删除了。<br>重新选一次这个文件即可继续，"
            + "选好后会自动跳回上次看到的位置。";
        }
        if (row) row.querySelector(".hp-spin")?.remove();
        return;
      }
    }

    // 没有句柄 / 句柄用不了：试文件本体缓存（拖放进来的书就是这条路）。
    // 缓存里存的就是当初导入的 File 对象，取回来原样重新走导入流程，
    // 不需要任何授权。
    const cached = await loadBookFiles(it.id);
    if (cached && cached.files && cached.files.length){
      const files = [];
      let ok = true;
      for (const rec of cached.files){
        try{
          files.push(new File([rec.blob], rec.name || "page", { type: rec.type || "" }));
        }catch(e){ ok = false; break; }
      }
      if (ok && files.length){
        await importFiles(files);   // importFiles 自己管理进度层
        return;
      }
    }
  }catch(e){ /* 句柄与缓存流程出任何意外，都落到下面的兜底流程 */ }

  // 兜底：提示重新选择。能走到这里说明句柄和缓存都没帮上忙，
  // 常见原因：这本书是在缓存功能上线前导入的、浏览器数据被清理、
  // 文件太大没进缓存，或刚才没允许授权。
  $("empty").classList.add("show");
  const fallbackBox = $("empty").querySelector(".box");
  if (fallbackBox){
    fallbackBox.querySelector("h2").textContent = "请重新选择文件";
    fallbackBox.querySelector("p").innerHTML =
      "记录「<b>" + escapeHtml(it.name) + "</b>」在第 <b>" + it.page + "</b> 页。"
      + "<br>本地没有找到这本书可用的文件缓存"
      + (hadHandles ? "（刚才的读取授权也没有被允许）" : "")
      + "，需要你再选一次文件；"
      + "选好后会自动跳回上次的位置，之后从「最近打开」点开就能一键直达。";
  }
  if (row) row.querySelector(".hp-spin")?.remove();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, (c) => (
    { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]
  ));
}

function openHistPanel(){

  closeThemePanel();            // 两个面板不同时开，避免叠在一起
  $("histPanel").classList.add("open");
